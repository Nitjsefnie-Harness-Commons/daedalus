[pycodestyle]
max-line-length = 10000
exclude = .idea, .venv, build, dist
# `ignore` REPLACES pycodestyle's defaults rather than adding to them, and
# pycodestyle has no extend-ignore (that is flake8), so anything still wanted
# has to be restated here.
#
# This list was built by removing each code and re-running: only these three
# suppress anything in this tree. W503 is half of the mutually exclusive
# W503/W504 pair. E401 and E701 are the codebase's own compact idiom -- one
# grouped import line per module, and `if <guard>: return ...` early exits in
# the request path -- consistent across server.py, mcp_server.py and the CLI.
ignore = W503,E401,E701
