name: Thresholds base
description: Resolve the single judged base for threshold removals.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPO: ${{ github.repository }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          git fetch --no-tags "https://github.com/${REPO}.git" \
            "refs/heads/${BASE_REF}"
          base="$(git merge-base HEAD FETCH_HEAD)"
        else
          base=
          if [ -n "$BEFORE" ]; then
            base="$(git rev-parse --verify \
              "${BEFORE}^{commit}" 2>/dev/null)" || base=
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify 'HEAD^' 2>/dev/null)" || {
              echo "Cannot resolve threshold base:" \
                "tried before '$BEFORE' and HEAD^." >&2
              exit 1
            }
          fi
        fi
        if [ -z "$base" ]; then
          echo "Cannot resolve threshold base for $EVENT" \
            "(target '$BASE_REF')." >&2
          exit 1
        fi
        printf 'DAEDALUS_THRESHOLDS_BASE_REV=%s\n' "$base" >> "$GITHUB_ENV"
