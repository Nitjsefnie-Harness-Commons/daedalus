name: release dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 0.28.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  release-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ github.ref == 'refs/heads/main' && 'main-push' || '' }}
    steps:
      - name: Refuse a dispatch that is not on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'Release dispatch requires the main branch.' >&2
          exit 1

      - name: Check out main without stored credentials
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.13
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Claim the release version on current main
        id: bump
        env:
          MASTER_PUSH_DEPLOY_KEY: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release_dispatch.py bump "$VERSION"

      - name: Wait for the release commit's gates to go green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: python3 scripts/ci/release_dispatch.py wait-gates "$SHA"

      - name: Push the annotated release tag
        env:
          MASTER_PUSH_DEPLOY_KEY: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: python3 scripts/ci/release_dispatch.py tag "$VERSION" "$SHA"

      - name: Require successful release publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: python3 scripts/ci/release_dispatch.py wait-release "$SHA"

      - name: Stop main claiming the published version
        env:
          MASTER_PUSH_DEPLOY_KEY: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release_dispatch.py bump "$VERSION" --successor
