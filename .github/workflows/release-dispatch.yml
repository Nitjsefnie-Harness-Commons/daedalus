name: release dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 0.28.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  release-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ github.ref == 'refs/heads/main' && 'main-push' || '' }}
    steps:
      - name: Refuse a dispatch that is not on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'Release dispatch requires the main branch.' >&2
          exit 1

      - name: Check out main without stored credentials
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.15
        # actions/setup-python v7.0.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'

      - name: Claim the release version on current main
        id: bump
        env:
          DAEDALUS_MASTER_PUSH_DEPLOY_KEY: >-
            ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release_dispatch.py bump "$DAEDALUS_VERSION"

      - name: Wait for the release commit's gates to go green
        env:
          GH_TOKEN: ${{ github.token }}
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_SHA: ${{ steps.bump.outputs.sha }}
        run: python3 scripts/ci/release_dispatch.py wait-gates "$DAEDALUS_SHA"

      - name: Push the annotated release tag
        env:
          DAEDALUS_MASTER_PUSH_DEPLOY_KEY: >-
            ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_VERSION: ${{ inputs.version }}
          DAEDALUS_SHA: ${{ steps.bump.outputs.sha }}
        run: >-
          python3 scripts/ci/release_dispatch.py tag "$DAEDALUS_VERSION"
          "$DAEDALUS_SHA"

      - name: Require successful release publication
        env:
          GH_TOKEN: ${{ github.token }}
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_SHA: ${{ steps.bump.outputs.sha }}
        run: >-
          python3 scripts/ci/release_dispatch.py wait-release "$DAEDALUS_SHA"

      - name: Stop main claiming the published version
        env:
          DAEDALUS_MASTER_PUSH_DEPLOY_KEY: >-
            ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_VERSION: ${{ inputs.version }}
        run: >-
          python3 scripts/ci/release_dispatch.py bump "$DAEDALUS_VERSION"
          --successor
