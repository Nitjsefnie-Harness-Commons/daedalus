name: lint

# Two gates, one job each so a failure says which tool found it.
#
# Style opinions stay off (max-line-length = 10000 in setup.cfg, and .pylintrc
# disables the formatting and metric checks): these exist for real defects, not
# formatting preferences. Every disable in .pylintrc names the pattern it is
# there for.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # No paths filter here: at least one gate must run on every commit
    # that can be tagged, and these six are the unfiltered set.
    # release.yml names no workflow of its own — it waits on the runs
    # for the tagged SHA and fails when the count of non-release runs
    # is zero; speed, version and actionlint keep their path filters.
  pull_request:
  workflow_dispatch:

# Read-only: without an explicit block a job inherits the
# repository default, which can be write for the whole token.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The MCP server's dependencies are installed for the same reason as in
      # types.yml: pylint resolves imports, so without them every httpx, mcp,
      # starlette and uvicorn line in mcp_server.py (and httpx in
      # scripts/mcp_probe.py) reports as import-error instead of being checked.
      - name: Install linters and the MCP server's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[mcp]"

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc
