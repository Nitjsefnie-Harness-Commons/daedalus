name: pr gate

# `pull_request_target` is required because a fork's `pull_request` token is
# read-only, so its comment and close would silently do nothing. This trigger
# runs the base branch's workflow with a writable token. It is safe here
# because checkout keeps the default base ref, the job runs no pull-request
# code, and only the body's TEXT crosses into the script through the
# environment.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened]

# pull-requests: write explains, closes, and reopens; issues: read checks
# assignment and reads ownership evidence. The job reads no tree beyond the
# base checkout.
permissions:
  pull-requests: write
  issues: read

concurrency:
  # Opposite `claim.yml`: racing claims are two people who each need an
  # answer, while quick edits are two answers to one question and only the
  # newest body matters.
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Closed pull requests need ownership checks inside the job, while bot
    # authors can be exempted before spending a runner.
    if: >-
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate pull request body
        # The body is contributor-controlled. Expressions stay in `env:` and
        # are never interpolated into the shell that consumes it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          pull_file="$(mktemp)"
          body_file="$(mktemp)"
          state_file="$(mktemp)"
          merged_file="$(mktemp)"
          decision_body_file="$(mktemp)"
          decision_state_file="$(mktemp)"
          decision_merged_file="$(mktemp)"
          render_body_file="$(mktemp)"
          rendered_file="$(mktemp)"
          analysis_file="$(mktemp)"
          reasons_file="$(mktemp)"
          comment_file="$(mktemp)"
          trap 'rm -f "$pull_file" "$body_file" "$state_file" \
            "$merged_file" "$decision_body_file" "$decision_state_file" \
            "$decision_merged_file" "$render_body_file" "$rendered_file" \
            "$analysis_file" "$reasons_file" "$comment_file"' EXIT

          fetch_pull() {
            if ! gh api "repos/$REPO/pulls/$PR" > "$pull_file"; then
              echo 'could not read the current pull request' >&2
              return 1
            fi
            if ! python3 - "$pull_file" "$1" "$2" "$3" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          body = payload.get('body')
          state = payload.get('state')
          merged = payload.get('merged')
          if body is None:
              body = ''
          if (not isinstance(body, str) or state not in ('open', 'closed')
                  or not isinstance(merged, bool)):
              raise ValueError('pull request response has an invalid shape')
          Path(sys.argv[2]).write_bytes(body.encode('utf-8'))
          Path(sys.argv[3]).write_bytes(f'{state}\n'.encode('ascii'))
          Path(sys.argv[4]).write_bytes(
              f'{str(merged).lower()}\n'.encode('ascii'))
          PY
            then
              echo 'could not read the current pull request fields' >&2
              return 1
            fi
          }

          if ! fetch_pull "$body_file" "$state_file" "$merged_file"; then
            exit 1
          fi
          IFS= read -r MERGED < "$merged_file"
          if [ "$MERGED" = true ]; then
            exit 0
          fi

          sentinel="$(python3 -c 'import secrets; print("pr-gate-sentinel-" + secrets.token_hex(32))')"
          cp "$body_file" "$render_body_file"
          printf '\n\n%s\n' "$sentinel" >> "$render_body_file"
          source_has_reference=0
          if grep -Eiq '#[0-9]+|https?://(www\.)?github\.com/[^/[:space:]]+/[^/[:space:]]+/(issues|pull)/[0-9]+' "$body_file"; then
            source_has_reference=1
          else
            grep_status="$?"
            if [ "$grep_status" -ne 1 ]; then
              echo 'could not inspect the pull request body' >&2
              exit 1
            fi
          fi
          numbers=''
          if ! gh api markdown -F "text=@$render_body_file" \
            -f mode=gfm -f "context=$REPO" > "$rendered_file"
          then
            echo 'could not render the pull request body' >&2
            exit 1
          fi
          if ! python3 scripts/ci/pr_body.py --sentinel "$sentinel" "$REPO" \
            .github/PULL_REQUEST_TEMPLATE.md "$body_file" \
            < "$rendered_file" | tr -d '\r' > "$analysis_file"
          then
            echo 'could not analyze the rendered pull request body' >&2
            exit 1
          fi
          sed -n 's/^layout://p' "$analysis_file" > "$reasons_file"
          numbers="$(sed -n 's/^issue://p' "$analysis_file")"
          # Tagged parser output makes the complete reference list countable.
          # shellcheck disable=SC2086
          set -- $numbers
          # Twenty supports unusually broad multi-issue changes while keeping
          # the API work safely inside this job's five-minute budget.
          claimed=0
          matched_issue=''
          checked=0
          for N in "$@"; do
            checked=$((checked + 1))
            if [ "$checked" -gt 20 ]; then
              break
            fi
            if lookup="$(gh api --include "repos/$REPO/issues/$N" \
              --jq 'if has("pull_request") then empty else
                (.assignees[].login | "assignee:\(.)") end')"
            then
              assignees="$(printf '%s\n' "$lookup" \
                | sed -n 's/^assignee://p')"
            else
              status="$(printf '%s\n' "$lookup" \
                | sed -n \
                  '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"
              if [ "$status" = 404 ]; then
                continue
              fi
              printf 'failed to look up issue %s (HTTP %s)\n' \
                "$N" "${status:-unknown}" >&2
              exit 1
            fi
            if printf '%s\n' "$assignees" | grep -Fxq "$ACTOR"; then
              claimed=1
              matched_issue="$N"
            fi
          done

          if [ "$#" -gt 20 ]; then
            echo 'This body names more than 20 issue references, so only the first 20 were checked.' >> "$reasons_file"
          elif [ "$claimed" -eq 0 ]; then
            echo 'No checked issue is assigned to you.' >> "$reasons_file"
          fi

          # Analysis belongs to the first current body, while state changes
          # belong to a second snapshot taken at the decision boundary.
          if ! fetch_pull "$decision_body_file" "$decision_state_file" \
            "$decision_merged_file"
          then
            exit 1
          fi
          if ! cmp -s "$body_file" "$decision_body_file"; then
            echo 'pull request body changed during validation' >&2
            exit 1
          fi
          IFS= read -r STATE < "$decision_state_file"
          IFS= read -r MERGED < "$decision_merged_file"
          if [ "$MERGED" = true ]; then
            exit 0
          fi

          owned_closed=0
          if [ "$STATE" = closed ]; then
            if ! closing_actors="$(gh api --paginate \
              "repos/$REPO/issues/$PR/timeline?per_page=100" \
              --jq '.[] | select(.event == "closed")
                | (.actor.login // "__unreadable__")')"
            then
              echo 'could not establish who closed the pull request' >&2
              exit 0
            fi
            closing_actor="$(printf '%s\n' "$closing_actors" \
              | awk 'NF { actor = $0 } END { print actor }')"
            if [ "$closing_actor" != 'github-actions[bot]' ]; then
              exit 0
            fi
            if ! markers="$(gh api --paginate \
              "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[]
                | select(.user.login == "github-actions[bot]")
                | select(.body | contains("<!-- pr-gate: close -->"))
                | .id')"
            then
              echo 'could not establish whether the gate closed this' >&2
              exit 0
            fi
            if [ -z "$markers" ]; then
              exit 0
            fi
            owned_closed=1
          elif [ "$STATE" != open ]; then
            exit 0
          fi

          if [ ! -s "$reasons_file" ]; then
            if [ "$owned_closed" -eq 0 ]; then
              printf 'pull request %s is covered by claimed issue %s\n' \
                "$PR" "$matched_issue"
              exit 0
            fi
            printf '@%s' "$ACTOR" > "$comment_file"
            cat <<'COMMENT' >> "$comment_file"
           — the body now names a claimed issue and matches the pull request
          template, so I am reopening it automatically.
          COMMENT
            gh api "repos/$REPO/issues/$PR/comments" \
              -F "body=@$comment_file" --silent
            gh api -X PATCH "repos/$REPO/pulls/$PR" \
              -f state=open --silent
            exit 0
          fi

          if [ "$owned_closed" -eq 1 ]; then
            exit 0
          fi

          printf '@%s' "$ACTOR" > "$comment_file"
          if [ "$source_has_reference" -eq 1 ]; then
            cat <<'COMMENT' >> "$comment_file"
           — this pull request needs changes, but it remains open.

          This pull request is not admissible yet:
          COMMENT
          else
            cat <<'COMMENT' >> "$comment_file"
           — closing this automatically, and it is recoverable: read on.
          <!-- pr-gate: close -->

          This pull request is not admissible yet:
          COMMENT
          fi
          while IFS= read -r reason; do
            printf -- '- %s\n' "$reason" >> "$comment_file"
          done < "$reasons_file"
          cat <<'COMMENT' >> "$comment_file"

          Fix every item above, including these two repository requirements:

          1. Comment `/claim` on the issue you are fixing. That assigns it to you,
             no write access needed — see CONTRIBUTING.md.
          2. Edit this same pull request so its sections match the pull request template.
             Its **Related Issues and Pull Requests** section must name the claimed
             issue as `Fixes #<issue>`, with the real number.
          COMMENT
          if [ "$source_has_reference" -eq 1 ]; then
            cat <<'COMMENT' >> "$comment_file"

          This pull request remains open. Edit it to fix every item above; the gate
          checks each edit, so there is no need to open a second pull request.
          COMMENT
          else
            cat <<'COMMENT' >> "$comment_file"

          The gate checks edits on this closed pull request and will reopen it automatically
          once every condition passes. There is no need to open a second pull request,
          and nothing here is lost.
          COMMENT
          fi
          # If the explanation cannot be posted, leave the pull request open
          # rather than close it silently. The reopen path likewise stays
          # closed if its explanation cannot be posted.
          gh api "repos/$REPO/issues/$PR/comments" \
            -F "body=@$comment_file" --silent
          # Render analysis may misstate a reason, but it cannot close a body
          # that plainly carries any GitHub issue-reference source spelling.
          if [ "$source_has_reference" -eq 1 ]; then
            exit 0
          fi
          gh api -X PATCH "repos/$REPO/pulls/$PR" \
            -f state=closed --silent
