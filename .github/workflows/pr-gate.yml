name: pr gate

# `pull_request_target` is required because a fork's `pull_request` token is
# read-only, so its comment and close would silently do nothing. This trigger
# runs the base branch's workflow with a writable token. It is safe here
# because checkout keeps the default base ref, the job runs no pull-request
# code, and only the body's TEXT crosses into the script through the
# environment.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened]

# pull-requests: write explains, closes, and reopens; issues: read checks
# assignment and reads ownership evidence. The job reads no tree beyond the
# base checkout.
permissions:
  pull-requests: write
  issues: read

concurrency:
  # Opposite `claim.yml`: racing claims are two people who each need an
  # answer, while quick edits are two answers to one question and only the
  # newest body matters.
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Closed pull requests need ownership checks inside the job, while bot
    # authors can be exempted before spending a runner.
    if: >-
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate pull request body
        # The body is contributor-controlled. Expressions stay in `env:` and
        # are never interpolated into the shell that consumes it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
          STATE: ${{ github.event.pull_request.state }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          if [ "$MERGED" = true ]; then
            exit 0
          fi

          owned_closed=0
          if [ "$STATE" = closed ]; then
            if ! closing_actors="$(gh api --paginate \
              "repos/$REPO/issues/$PR/timeline?per_page=100" \
              --jq '.[] | select(.event == "closed")
                | (.actor.login // "__unreadable__")')"
            then
              echo 'could not establish who closed the pull request' >&2
              exit 0
            fi
            closing_actor="$(printf '%s\n' "$closing_actors" \
              | awk 'NF { actor = $0 } END { print actor }')"
            if [ "$closing_actor" != 'github-actions[bot]' ]; then
              exit 0
            fi
            if ! markers="$(gh api --paginate \
              "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[]
                | select(.user.login == "github-actions[bot]")
                | select(.body | contains("<!-- pr-gate: close -->"))
                | .id')"
            then
              echo 'could not establish whether the gate closed this' >&2
              exit 0
            fi
            if [ -z "$markers" ]; then
              exit 0
            fi
            owned_closed=1
          elif [ "$STATE" != open ]; then
            exit 0
          fi

          body_file="$(mktemp)"
          rendered_file="$(mktemp)"
          analysis_file="$(mktemp)"
          reasons_file="$(mktemp)"
          comment_file="$(mktemp)"
          trap 'rm -f "$body_file" "$rendered_file" "$analysis_file" \
            "$reasons_file" "$comment_file"' EXIT
          printf '%s' "$BODY" > "$body_file"
          numbers=''
          if ! gh api markdown -F "text=@$body_file" \
            -f mode=gfm -f "context=$REPO" > "$rendered_file"
          then
            echo 'could not render the pull request body' >&2
            exit 1
          fi
          if ! python3 scripts/ci/pr_body.py "$REPO" \
            .github/PULL_REQUEST_TEMPLATE.md "$body_file" \
            < "$rendered_file" | tr -d '\r' > "$analysis_file"
          then
            echo 'could not analyze the rendered pull request body' >&2
            exit 1
          fi
          sed -n 's/^layout://p' "$analysis_file" > "$reasons_file"
          numbers="$(sed -n 's/^issue://p' "$analysis_file")"
          # Tagged parser output makes the complete reference list countable.
          # shellcheck disable=SC2086
          set -- $numbers
          # Twenty supports unusually broad multi-issue changes while keeping
          # the API work safely inside this job's five-minute budget.
          claimed=0
          matched_issue=''
          checked=0
          for N in "$@"; do
            checked=$((checked + 1))
            if [ "$checked" -gt 20 ]; then
              break
            fi
            if lookup="$(gh api --include "repos/$REPO/issues/$N" \
              --jq 'if has("pull_request") then empty else
                (.assignees[].login | "assignee:\(.)") end')"
            then
              assignees="$(printf '%s\n' "$lookup" \
                | sed -n 's/^assignee://p')"
            else
              status="$(printf '%s\n' "$lookup" \
                | sed -n \
                  '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"
              if [ "$status" = 404 ]; then
                continue
              fi
              printf 'failed to look up issue %s (HTTP %s)\n' \
                "$N" "${status:-unknown}" >&2
              exit 1
            fi
            if printf '%s\n' "$assignees" | grep -Fxq "$ACTOR"; then
              claimed=1
              matched_issue="$N"
            fi
          done

          if [ "$#" -gt 20 ]; then
            echo 'This body names more than 20 issue references, so only the first 20 were checked.' >> "$reasons_file"
          elif [ "$claimed" -eq 0 ]; then
            echo 'No checked issue is assigned to you.' >> "$reasons_file"
          fi

          if [ ! -s "$reasons_file" ]; then
            if [ "$owned_closed" -eq 0 ]; then
              printf 'pull request %s is covered by claimed issue %s\n' \
                "$PR" "$matched_issue"
              exit 0
            fi
            printf '@%s' "$ACTOR" > "$comment_file"
            cat <<'COMMENT' >> "$comment_file"
           — the body now names a claimed issue and matches the pull request
          template, so I am reopening it automatically.
          COMMENT
            gh api "repos/$REPO/issues/$PR/comments" \
              -F "body=@$comment_file" --silent
            gh api -X PATCH "repos/$REPO/pulls/$PR" \
              -f state=open --silent
            exit 0
          fi

          if [ "$owned_closed" -eq 1 ]; then
            exit 0
          fi

          printf '@%s' "$ACTOR" > "$comment_file"
          cat <<'COMMENT' >> "$comment_file"
           — closing this automatically, and it is recoverable: read on.
          <!-- pr-gate: close -->

          This pull request is not admissible yet:
          COMMENT
          while IFS= read -r reason; do
            printf -- '- %s\n' "$reason" >> "$comment_file"
          done < "$reasons_file"
          cat <<'COMMENT' >> "$comment_file"

          Fix every item above, including these two repository requirements:

          1. Comment `/claim` on the issue you are fixing. That assigns it to you,
             no write access needed — see CONTRIBUTING.md.
          2. Edit this same pull request so its sections match the pull request template.
             Its **Related Issues and Pull Requests** section must name the claimed
             issue as `Fixes #<issue>`, with the real number.

          The gate checks edits on this closed pull request and will reopen it automatically
          once every condition passes. There is no need to open a second pull request,
          and nothing here is lost.
          COMMENT
          # If the explanation cannot be posted, leave the pull request open
          # rather than close it silently. The reopen path likewise stays
          # closed if its explanation cannot be posted.
          gh api "repos/$REPO/issues/$PR/comments" \
            -F "body=@$comment_file" --silent
          gh api -X PATCH "repos/$REPO/pulls/$PR" \
            -f state=closed --silent
