name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# TRIGGER DIFFERS FROM THE OTHER WORKFLOWS ON PURPOSE. `analyze` uploads its
# SARIF against the ref and SHA of the *event*, so CodeQL has to analyse
# exactly the commit its alerts will be filed against — which is why the
# checkout below takes no explicit `ref:`. `push` here covers `main` only,
# so the `pull_request:` trigger is what analyses the head of a same-repo
# pull request before merge — load-bearing, not redundant.
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # Threshold state is produced by the tests workflow. A push containing
    # only that data skips this expensive analysis; source pushes still run.
    paths-ignore:
      - '.github/ci-thresholds.json'
    # release.yml names no workflow of its own — it waits on the runs
    # for the tagged SHA and fails when the count of non-release runs
    # is zero; audit.yml remains the repository-controlled unfiltered gate.
  pull_request:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # Both shipped languages, plus the workflows themselves. The extension
      # service worker, the page relay and the dashboard modules are the half
      # of this repository that runs in someone else's browser, so leaving
      # them unanalysed would exempt exactly the code with the widest
      # exposure. `actions` covers the other privileged half: a release that
      # attests provenance, a ratchet that pushes to `main` with a deploy
      # key, and a `/claim` command driven by issue comments. actionlint and
      # zizmor already read those files for known-wrong shapes; CodeQL asks a
      # dataflow question of them instead, and the two find different things.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here: CodeQL must analyse exactly the commit it will
          # file alerts against, which is the event's own SHA.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this code
          # builds filesystem paths out of caller-supplied components and
          # relays values between a page, an extension and an HTTP bridge,
          # which is what the extra precision-medium queries are good at.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
