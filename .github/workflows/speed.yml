name: speed

# Did the test suite get slower since the last release?
#
# THE MEASUREMENT ONLY MEANS ANYTHING BECAUSE BOTH BUILDS RUN IN ONE CELL. A
# GitHub runner's speed varies by roughly a factor of two between jobs, so a
# duration recorded in one job compared against a duration recorded in another
# measures the runners, not the code. Every cell checks out the last release
# AND this commit, runs both on the same machine, and reports the ratio; the
# paired comparison never crosses a cell, and the final job combines verdicts,
# never seconds.
#
# ONE ROUND IS DISCARDED BEFORE ANY MEASUREMENT, and it is not ceremony. The
# first suite a job runs pays for a cold page cache, and interleaving does not
# share that cost — it lands entirely on whichever side goes first, which was
# always the baseline. Measured over the eight successful runs that kept their
# duration artifacts, the baseline's first round exceeded its second by 19.14s
# on average and was the largest of the four totals in 8 of 8 runs, while the
# head's first round exceeded its second by 0.96s. On a ~290s suite that is a
# 6.5% bias in the first pair, in the same direction every time, so no number
# of rounds averages it away: it made every verdict roughly 3% optimistic.
# (Not bytecode — PYTHONDONTWRITEBYTECODE is set below, so every round
# recompiles. The previous shape, a minimum across rounds, hid this by
# discarding the inflated value rather than by not producing it.)
#
# Rounds are INTERLEAVED — base, head, base, head — and compared IN PAIRS:
# round 1 of the baseline against round 1 of this commit, and so on. Pairing
# is what keeps every reported total one that a complete run achieved;
# interleaving is what puts whatever the runner was doing into both halves of
# each ratio. The verdict is the MEDIAN of those paired ratios, so one pair
# spoiled by a noisy neighbour cannot decide it.
#
# Each side installs ITS OWN dependencies from ITS OWN tree. That is not
# incidental here: the baseline floors the versions this line pins exactly, so
# the two sides resolve differently on purpose — and a release that got slower
# because a bumped library got slower is a real regression that holding
# dependencies fixed would hide.
#
# TWO BASELINES, chosen by what the run is answering. On a push to a branch
# the question is "is this line slower than what we shipped", so the baseline
# is the last release. On a pull request the question is "did THIS branch make
# it slower", so the baseline is the exact base SHA the branch would merge
# into — comparing a branch against the last release instead would fold every
# commit merged since that release into the number and attribute all of it to
# whoever opened the pull request. Both go through the same machinery below.
#
# The comparison — intersect on test name, so adding or removing a test cannot
# move the number — lives in scripts/ci/compare_durations.py, which has its own
# tests. Its module docstring explains why total wall time is the wrong metric.
#
# The timing is done BY THIS COMMIT'S instrument, for both sides. Durations
# that a checkout had to report about itself would only ever exist on the side
# that already carried the feature — which is the side whose speed was never in
# question. scripts/ci/time_tests.py asks nothing of the tree it measures: it
# runs each suite with -u and reads the wall clock as each result line arrives,
# so any release, however old, is measurable.
#
# THE WORK IS SPLIT THREE WAYS, because a benchmark of a broken tree is a
# number nobody can act on and a whole-tree benchmark is one long queue.
#
# `correctness` measures nothing. It waits for the tests workflow's aggregate
# check on the commit the tests run attaches its check runs to — the pull
# request's head, or the pushed commit where there is no pull request — and
# fails unless that check passed, which is what keeps the cells below from
# spending six whole-suite executions on a tree whose tests are red.
#
# `timed` is the matrix. Each cell owns one disjoint slice of `tests/` and
# carries the whole measurement inside it: two checkouts, one virtualenv per
# side, a discarded warm-up, interleaved measured rounds, and the comparison.
# A cell fails when ITS comparison fails, so a slowdown is attributable to a
# slice of the suite rather than buried in a 55-minute total. Its `name:` is
# static on purpose: a skipped matrix job still creates one check run, named
# after the job's `name:` verbatim, and an expression there would print the
# raw template into that name whenever the cells never started.
#
# `speed` is the single verdict and the only cell-independent check name. It
# requires the matrix and fails when any cell failed, and it builds the
# per-cell table out of the verdict record each cell left in the artifact it
# uploaded — never out of check runs, which a skipped cell leaves none of.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being measured under an allow-list.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # `pull_request`, never `pull_request_target`: the timed cells check out and
  # RUN the proposed code, and pull_request_target would run it with a
  # writable token and the base repository's secrets in reach.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # NO `workflow_dispatch`, deliberately, and this is the one workflow here
  # that gives it up.
  #
  # Code scanning reports three cache-poisoning findings against this file,
  # and every one of them names the trigger — `due to privilege checkout of
  # untrusted code from steps.baseline.outputs.ref. (workflow_dispatch)`,
  # quoted as the alerts worded it, back when that output was still named
  # `ref` — rather than any cache input. They are FALSE POSITIVES:
  # the query treats `workflow_dispatch` as running in the default
  # branch's cache scope whatever ref it was started on, while a real
  # run's cache scope follows the ref it was given. Dispatching on
  # main runs main's own code; dispatching on a feature ref writes
  # that ref's scope, not main's. The combination the query describes
  # does not arise.
  #
  # The trigger goes anyway, because the alternative is carrying three
  # permanently dismissed alerts on a file whose checkout ref is a step
  # output no analyser can trace. What it costs is benchmarking a ref that
  # has no pull request open; the two triggers above answer the two questions
  # named at the top of this file, and anything under review has a pull
  # request. Re-run a finished run from its own page.

permissions:
  contents: read

concurrency:
  # Keyed by pull request where there is one, so two open pull requests do not
  # cancel each other — on a pull_request event github.ref is the same
  # refs/pull/N/merge shape but the number is what identifies the work.
  group: speed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-latest

    # The wait is bounded, and the bound has to be shorter than this ceiling:
    # a job killed for being patient is the one failure a wait must not have.
    timeout-minutes: 60

    steps:
      - name: Wait for the correctness aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The commit the tests workflow attaches its check runs to: the pull
          # request's head, or the pushed commit where there is no pull
          # request. It is the same commit the cells below check out, and it
          # is never `github.sha` on a pull request, which names the merge
          # commit — a commit this repository's checks never attach to, so a
          # wait on it would burn its whole bound on a green tree. It travels
          # by environment rather than being expanded inside the script: a
          # SHA from a payload is caller-controlled text.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The name below is the tests workflow's aggregate job, spelled
        # exactly as that job's `name:` prints it. Nothing else in this
        # repository carries that name, and tests/test_speed_gate.py holds
        # the two files to the same string.
        #
        # Three endings, none of them a silent pass: the aggregate passed and
        # the measurement may start; the aggregate concluded anything else and
        # this job fails, which is what skips the cells; or the bound ran out
        # without a completed aggregate — a missing gate is not a passing one,
        # so that fails too. A commit whose checks have not appeared yet is
        # waited out under the same bound as one whose aggregate is still
        # going: registration is queue-dependent, so the first polls of a
        # green run can see none. A failed read is reported as one and waited
        # out under the same bound, instead of being mistaken for an empty
        # commit.
        run: |
          aggregate='Aggregate workflow checks'
          tries=45
          attempt=0
          while [ "$attempt" -lt "$tries" ]; do
            attempt=$((attempt + 1))
            if ! states="$(gh api --paginate -H 'Cache-Control: no-cache' \
                      "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                      --jq '.check_runs[]
                            | "\(.name)\t\(.status)\t\(.conclusion // "")"'
                      )"; then
              echo "The checks on $SHA could not be read; waiting" \
                   "(attempt $attempt of $tries)" >&2
              sleep 60
              continue
            fi
            found="$(printf '%s\n' "$states" | sort -u \
              | awk -F'\t' -v name="$aggregate" \
                     '$1 == name { print $2 "\t" $3 }')"
            if [ -z "$found" ]; then
              echo "waiting: no check runs on $SHA yet" \
                   "(attempt $attempt of $tries)"
              sleep 60
              continue
            fi
            # `found` rows are status TAB conclusion: the name was stripped
            # selecting them, so the status is field one and the conclusion
            # field two.
            pending="$(printf '%s\n' "$found" \
              | awk -F'\t' '$1 != "completed" { n++ } END { print n + 0 }')"
            failed="$(printf '%s\n' "$found" \
              | awk -F'\t' \
                     '$1 == "completed" && $2 != "success" { n++ } END {
                        print n + 0 }')"
            if [ "$failed" -gt 0 ]; then
              echo "The correctness aggregate on $SHA did not pass:" >&2
              printf '%s\n' "$found" >&2
              echo "Speed benchmarks a tree only once its tests pass, so" >&2
              echo "there is nothing here worth measuring." >&2
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "Correctness aggregate on $SHA passed."
              exit 0
            fi
            echo "waiting: the aggregate is still running" \
                 "(attempt $attempt of $tries)"
            sleep 60
          done
          echo "No completed '$aggregate' check run on $SHA within $tries" >&2
          echo "attempts. A missing aggregate is not a pass: either the" >&2
          echo "tests workflow never ran on this commit, has not" >&2
          echo "registered its checks yet, is still going, or its checks" >&2
          echo "could not be read." >&2
          exit 1

  timed:
    # Static, and free of expressions on purpose: a matrix job this run never
    # started still gets one check run, named after this field verbatim, and
    # an expression here would print the raw template into that name. A cell
    # that did run still gets its group appended by GitHub, and attributes
    # itself to the verdict job through the record it uploads.
    name: timed
    needs: [correctness]
    runs-on: ubuntu-latest

    # This job checks out a pull request's OWN head and runs it, and an
    # environment is the only control GitHub offers that decides whose code
    # gets to start at all. A branch pushed to this repository is already
    # the work of someone who can push here, so it benchmarks with no
    # ceremony; a fork is not, so it waits for a reviewer. Both names exist
    # as environments: `benchmark` carries no protection rules,
    # `fork-benchmark` requires a review before the job starts.
    #
    # This gates the measuring cells and nothing else. The wait job reads a
    # check run, the verdict job reads check runs and writes a summary, and
    # neither touches the tree. tests.yml still runs a fork's code on its
    # `suites`, `wheel` and `coverage` jobs; the lever that would gate every
    # workflow at once is the repository's `fork-pr-contributor-approval`
    # setting, moving from `first_time_contributors` to
    # `all_external_contributors`.
    #
    # The cost of naming an environment here: every same-repo push and pull
    # request writes a deployment record per cell, and `benchmark` is a real
    # environment, so a secret attached to it later is in reach of every
    # branch pushed to this repository.
    environment: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
      && 'fork-benchmark' || 'benchmark' }}
    # Two discarded warm-up runs, four measured ones, and two installs —
    # the whole budget a single cell needs, however many cells run beside it.
    timeout-minutes: 90

    strategy:
      # A slow or failing slice must not cancel its siblings: each cell owns
      # a verdict, and losing the others to one of them is a smaller
      # measurement, not a faster one.
      fail-fast: false
      matrix:
        # One cell per slice of `tests/`. The named groups are disjoint, and
        # the last cell is the catch-all: it takes every suite file the named
        # globs do not match, so a suite added later and matched by nothing is
        # still measured rather than silently dropping out of the gate.
        include:
          - group: bridge
            suites: >-
              test_bridge_credentials.py test_bridge_requests.py
              test_bridge_uploads.py test_bridge_startup.py
              test_bridge_tabs.py test_path_safety.py
          - group: bridge-delivery
            suites: >-
              test_bridge_results.py test_bridge_streams.py
              test_delivery_*.py test_result_*.py test_control_*.py
          - group: queue
            suites: >-
              test_cmdqueue*.py test_command_queue*.py test_stream_*.py
          - group: segment
            suites: >-
              test_segment_*.py
          - group: mcp
            suites: >-
              test_mcp_*.py
          - group: cli
            suites: >-
              test_cli*.py test_pr_*.py
          - group: repo-ci
            suites: >-
              test_ci_*.py test_workflow_*.py test_yamlread*.py
              test_wf*.py test_ghexpr.py test_speed_gate.py
              test_speed_measurement.py
              test_suite_runner.py test_child_coverage.py
              test_worker_runtime.py test_worker_module_boundary.py
              test_change_classifier.py test_version_contract.py
              test_release_scan.py test_repo_layout.py test_file_sizes.py
              test_gitignore_*.py test_checkout_pin.py
          - group: coverage
            suites: >-
              test_coverage_*.py test_diff_coverage.py
              test_diff_coverage_*.py test_js_coverage*.py
          - group: browser
            suites: >-
              test_real_browser_*.py test_eval_relay.py test_gm_*.py
              test_vm_file_load_guard.py test_extension_*.py
              test_worker_route_guard.py
          - group: dashboard
            suites: >-
              test_dashboard_*.py test_overlap_harness.py test_js_lines.py
          - group: tab-routing
            suites: test_tab_routing.py
          - group: catchall
            suites: '*'
            except: >-
              test_bridge_credentials.py test_bridge_requests.py
              test_bridge_uploads.py test_bridge_startup.py
              test_bridge_tabs.py test_path_safety.py
              test_bridge_results.py test_bridge_streams.py
              test_delivery_*.py test_result_*.py test_control_*.py
              test_cmdqueue*.py test_command_queue*.py test_stream_*.py
              test_segment_*.py
              test_mcp_*.py
              test_cli*.py test_pr_*.py
              test_ci_*.py test_workflow_*.py test_yamlread*.py
              test_wf*.py test_ghexpr.py test_speed_gate.py
              test_speed_measurement.py
              test_suite_runner.py test_child_coverage.py
              test_worker_runtime.py test_worker_module_boundary.py
              test_change_classifier.py test_version_contract.py
              test_release_scan.py test_repo_layout.py test_file_sizes.py
              test_gitignore_*.py test_checkout_pin.py
              test_coverage_*.py test_diff_coverage.py
              test_diff_coverage_*.py test_js_coverage*.py
              test_real_browser_*.py test_eval_relay.py test_gm_*.py
              test_vm_file_load_guard.py test_extension_*.py
              test_worker_route_guard.py
              test_dashboard_*.py test_overlap_harness.py test_js_lines.py
              test_tab_routing.py

    env:
      # Fractional slowdown that fails the job.
      MAX_REGRESSION: "0.30"
      ROUNDS: "2"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Find the baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        # Values reach this script through the environment rather than through
        # `${{ }}` inside it, so nothing a payload carries is ever expanded as
        # shell.
        #
        # `gh api` on a 404 prints its JSON error body to STDOUT and exits
        # nonzero. Ending this in `|| true` would discard the exit code and
        # assign that blob to $ref — so the "no release yet" guard would see a
        # non-empty string, fall through, and hand actions/checkout a refspec
        # made of JSON. Hence both belts: branch on the EXIT CODE, then
        # validate the SHAPE, so no payload can reach a git command as a ref.
        run: |
          ref=""
          if [ "$EVENT" = pull_request ]; then
            ref="$PR_BASE"
          elif out="$(gh api -H "Cache-Control: no-cache" \
                      "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            ref="$out"
          fi
          case "$ref" in
            null) ref="" ;;
            *[!A-Za-z0-9._-]*)
              echo "Unexpected payload where a ref was expected; treating" >&2
              echo "as 'no baseline' rather than passing it to git." >&2
              ref=""
              ;;
          esac
          # The output is named `point`, not `ref`, on purpose. The value is
          # the pull request's base SHA or a published release tag — trusted
          # code, never the pull request's head — and CodeQL's
          # untrusted-checkout heuristic reads any checkout whose ref comes
          # from a step output named like head, branch, ref, sha or commit
          # as checking out an untrusted head. Renaming this output back to
          # `ref` would silently reintroduce that alert.
          if [ -z "$ref" ]; then
            echo "point=" >> "$GITHUB_OUTPUT"
            echo "No release exists yet, so there is no baseline to compare"
            echo "against. This becomes a real gate once release.yml cuts one."
            {
              echo "### Test speed"
              echo
              echo "Skipped: no release exists yet to use as a baseline."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "point=$ref" >> "$GITHUB_OUTPUT"
            echo "Baseline: $ref"
          fi

      - name: Check out this commit
        if: steps.baseline.outputs.point != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The exact head of the pull request, not the merge commit checkout
          # defaults to on that event: the merge commit is a tree nobody
          # authored, and a duration measured on it belongs to no reviewable
          # SHA. On a push there is no pull request and github.sha is the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Check out the baseline
        if: steps.baseline.outputs.point != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.point }}
          path: base
          persist-credentials: false

      # No `cache: pip`. setup-python saves its cache in a post-job step, so
      # asking for one here would have this job write cross-run state after it
      # has already run the code it was measuring. Without the input that post
      # step is a no-op, so this job declares no cache action at all — which
      # is not the same as having no cache reachable: code running here still
      # has whatever Actions cache scope its event grants.
      #
      # This is not what answers the cache-poisoning findings — those name the
      # trigger, which is why `workflow_dispatch` is gone above. It is not a
      # measurement fix either: both installs finish before the discarded
      # warm-up, so a warm or cold pip cache moves setup time rather than the
      # ratio the job reports.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.baseline.outputs.point != ''
        with:
          python-version: "3.13"

      - name: Build one virtualenv per side
        if: steps.baseline.outputs.point != ''
        # Separate environments because the two sides pin different versions,
        # and a shared one would silently benchmark whichever resolved last
        # against both trees.
        run: |
          for side in base head; do
            python -m venv "venv-$side"
            "venv-$side/bin/python" -m pip install --quiet --upgrade pip
            "venv-$side/bin/python" -m pip install --quiet \
              "./${side}" "./${side}[mcp]"
          done
          # grep rather than `head -2`: head closes the pipe after two lines,
          # pip takes the broken pipe, prints "ERROR: Pipe to stdout was
          # broken" and exits 120 — a nonzero producer hidden behind a
          # successful truncation. grep reads the whole stream, so there is
          # no early close to report, and under pipefail a pip that genuinely
          # failed still fails the step.
          echo "base mcp:"; "venv-base/bin/python" -m pip show mcp | grep -E '^(Name|Version):'
          echo "head mcp:"; "venv-head/bin/python" -m pip show mcp | grep -E '^(Name|Version):'

      - name: Run both suites, interleaved
        if: steps.baseline.outputs.point != ''
        env:
          # The cell's slice of the tree, as space-separated globs over the
          # suite file names. Both are empty when the matrix cell names
          # neither, and the instrument then times every suite.
          SUITES_ONLY: ${{ matrix.suites }}
          SUITES_EXCEPT: ${{ matrix.except }}
        # A failing test does NOT fail this job: tests.yml owns that verdict,
        # and a non-passing test is simply absent from the side's durations and
        # drops out of the intersection. What this step must guarantee is that
        # every round produced usable reports on BOTH sides, so it checks for
        # them explicitly rather than trusting an exit code it ignores.
        run: |
          # set -f keeps the glob metacharacters away from the shell's own
          # pathname expansion — they have to reach the instrument as
          # patterns — and the unquoted expansion below is what turns the
          # matrix's space-separated list into one argument per glob. It is
          # turned off again before the step's own globs run: the guard that
          # checks every round's reports below has to expand those globs,
          # and under noglob it would stat one literal path and report a
          # step that measured everything as having produced nothing.
          set -f
          selection=()
          if [ -n "$SUITES_ONLY" ]; then
            # shellcheck disable=SC2086,SC2206
            selection+=(--only $SUITES_ONLY)
          fi
          if [ -n "$SUITES_EXCEPT" ]; then
            # shellcheck disable=SC2086,SC2206
            selection+=(--except $SUITES_EXCEPT)
          fi
          set +f

          mkdir -p reports
          # Round 0 is thrown away. It is written outside the reports/base-*
          # and reports/head-* globs the comparison reads, so nothing has to
          # remember to exclude it, and it is uploaded with the rest because
          # the size of what it absorbs is the evidence for doing it at all.
          for side in base head; do
            echo "::group::$side warm-up (discarded)"
            python3 head/scripts/ci/time_tests.py \
              --tree "$side" \
              --python "$GITHUB_WORKSPACE/venv-$side/bin/python" \
              --out "$GITHUB_WORKSPACE/reports/warmup/$side" \
              "${selection[@]}" \
              || echo "$side warm-up: timing reported a problem"
            echo "::endgroup::"
          done

          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              echo "::group::$side round $round"
              python3 head/scripts/ci/time_tests.py \
                --tree "$side" \
                --python "$GITHUB_WORKSPACE/venv-$side/bin/python" \
                --out "$GITHUB_WORKSPACE/reports/$side-$round" \
                "${selection[@]}" \
                || echo "$side round $round: timing reported a problem"
              echo "::endgroup::"
            done
          done

          missing=0
          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              if ! ls "reports/$side-$round"/*.json >/dev/null 2>&1; then
                echo "MISSING: reports/$side-$round has no durations" >&2
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "A side produced no durations at all, which is a setup" >&2
            echo "failure rather than a speed result." >&2
            exit 1
          fi
          ls -la reports/*/

      - name: Compare
        id: compare
        if: steps.baseline.outputs.point != ''
        env:
          BASE_LABEL: ${{ steps.baseline.outputs.point }}
        # The comparator comes from the HEAD checkout, so an improvement to the
        # comparison itself takes effect on the commit that makes it rather
        # than one release later. The round directories hold this cell's
        # reports alone, and the comparison intersects on test name, so a
        # slice of the tree compares correctly on its own.
        run: |
          # shellcheck disable=SC2046
          python3 head/scripts/ci/compare_durations.py \
            --base $(ls -d reports/base-*) \
            --head $(ls -d reports/head-*) \
            --max-regression "$MAX_REGRESSION" \
            --base-label "$BASE_LABEL" \
            --require-measurements \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Record the cell verdict
        # Runs whenever the cell did work, a failed comparison included: the
        # cell that failed its comparison is exactly the one whose verdict
        # the final job has to be able to show, and it reads these records
        # out of the artifacts rather than out of check runs, which a cell
        # that never started leaves none of behind.
        if: ${{ !cancelled() && steps.baseline.outputs.point != '' }}
        env:
          GROUP: ${{ matrix.group }}
          VERDICT: ${{ steps.compare.outcome }}
        run: |
          mkdir -p reports
          case "$VERDICT" in
            success) verdict=pass ;;
            *) verdict=fail ;;
          esac
          printf '{"group": "%s", "verdict": "%s"}\n' "$GROUP" "$verdict" \
            > reports/verdict.json

      - name: Upload the duration summaries
        if: ${{ !cancelled() && steps.baseline.outputs.point != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # One artifact per cell: a name the whole matrix shares would
          # collide, and a reader looking for one slice's numbers should not
          # have to download every other slice's.
          name: speed-durations-${{ matrix.group }}
          path: reports/
          if-no-files-found: warn

  speed:
    # The one verdict, and the job that keeps this workflow's check name.
    needs: [correctness, timed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Every cell that measured uploaded one artifact named after its group,
      # and each carries the group's verdict beside its reports. A pattern
      # that matches nothing is fine: it is what a run with no baseline to
      # measure against looks like, and the verdict step explains an empty
      # table rather than failing the job for having nothing to read.
      - name: Fetch the cells' verdicts
        # actions/download-artifact v7.0.0
        uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: speed-durations-*
          path: cells

      - name: Aggregate the cell verdicts
        if: ${{ always() }}
        env:
          # The needs results are the verdict; they reach the script by
          # environment because a needs result is workflow state, and no
          # expression is interpolated into the script itself. `cancelled()`
          # has no env form, and it is not needed: a cancelled run shows up
          # here as a cancelled or skipped need.
          CORRECTNESS: ${{ needs.correctness.result }}
          TIMED: ${{ needs.timed.result }}
        # A cancelled run produced no measurement and gets no verdict. A red
        # aggregate is the signal that the tree is broken, and this job says
        # so instead of failing again on cells that never ran. Any other time,
        # the cells ran, and one failed cell fails this job — while the table
        # beside that verdict is read out of what the cells themselves wrote.
        run: |
          if [ "$CORRECTNESS" = "cancelled" ] || [ "$TIMED" = "cancelled" ]; then
            {
              echo "### Test speed"
              echo
              echo "The run was cancelled, so no speed verdict was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CORRECTNESS" != "success" ]; then
            {
              echo "### Test speed"
              echo
              echo "Not run: the correctness aggregate on this commit is" \
                   "\`$CORRECTNESS\`, and speed benchmarks a tree only once" \
                   "its tests pass. That red is the signal; the skipped" \
                   "cells add nothing to it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Each measuring cell uploaded a verdict record named after the
          # group it benchmarked, so the rows below come from the cells'
          # own conclusions rather than from a list restated here. A record
          # that cannot be read is reported and left out of the table rather
          # than turned into a verdict; the job's own verdict still comes
          # from the matrix result alone.
          table="$(for record in cells/*/verdict.json; do
            [ -f "$record" ] || continue
            line="$(cat "$record")"
            group="${line#*'{"group": "'}"
            verdict="${line#*', "verdict": "'}"
            if [ "$group" = "$line" ] || [ "$verdict" = "$line" ]; then
              echo "Unreadable verdict record: $record" >&2
              continue
            fi
            group="${group%%\"*}"
            verdict="${verdict%%\"*}"
            # shellcheck disable=SC2016  # the backticks are markdown
            printf '| %s | %s | `speed-durations-%s` |\n' \
              "$group" "$verdict" "$group"
          done)"

          {
            echo "### Test speed"
            echo
            echo "Each cell benchmarks its own slice of the suite: baseline" \
                 "and head on one runner, warm-up discarded, rounds" \
                 "interleaved. No number crosses runners, and the verdict is" \
                 "per cell."
            echo
            echo "| cell | verdict | durations artifact |"
            echo "|---|---|---|"
            printf '%s\n' "$table"
            if [ -z "$table" ]; then
              echo
              echo "No cell uploaded a verdict, so the table is empty. On a" \
                   "green run that means no release existed to measure" \
                   "against; the verdict still came from the matrix job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TIMED" != "success" ]; then
            echo "At least one speed cell failed; its own summary carries" >&2
            echo "the paired ratios that decided it." >&2
            exit 1
          fi
          if [ -n "$table" ]; then
            echo "Every speed cell passed."
          else
            echo "No cell uploaded a verdict, so no speed comparison ran."
          fi
