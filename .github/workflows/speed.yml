name: speed

# Did the test suite get slower since the last release?
#
# THE MEASUREMENT ONLY MEANS ANYTHING BECAUSE BOTH BUILDS RUN HERE. A GitHub
# runner's speed varies by roughly a factor of two between jobs, so a duration
# recorded in one job compared against a duration recorded in another measures
# the runners, not the code. This job checks out the last release AND this
# commit, runs both on the same machine, and reports the ratio.
#
# Rounds are INTERLEAVED — base, head, base, head — and each test's duration is
# the minimum across its rounds. Interleaving keeps a warming page cache or a
# noisy neighbour from landing entirely on one side; the minimum estimates the
# floor, which is the quantity that actually changes when code gets slower.
#
# Each side installs ITS OWN dependencies from ITS OWN tree. That is not
# incidental here: the baseline pins mcp<2 and this line requires mcp>=2, and a
# release that got slower because a bumped library got slower is a real
# regression that holding dependencies fixed would hide.
#
# The comparison — intersect on test name, so adding or removing a test cannot
# move the number — lives in scripts/ci/compare_durations.py, which has its own
# tests. Its module docstring explains why total wall time is the wrong metric.
#
# Until a release exists that RECORDS per-test durations there is nothing to
# compare against. The baseline's run_tests.py ignores the environment variable
# below and writes its summaries to a temp directory it discards, so its report
# directories come out empty and the comparator says so and exits green. This
# becomes a real gate at the next release.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being measured under an allow-list.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-latest
    # Four full runs of a suite that drives a real browser, plus two installs.
    timeout-minutes: 60

    env:
      # Fractional slowdown that fails the job.
      MAX_REGRESSION: "0.30"
      ROUNDS: "2"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Find the baseline release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # `gh api` on a 404 prints its JSON error body to STDOUT and exits
        # nonzero. Ending this in `|| true` would discard the exit code and
        # assign that blob to $tag — so the "no release yet" guard would see a
        # non-empty string, fall through, and hand actions/checkout a refspec
        # made of JSON. Hence both belts: branch on the EXIT CODE, then
        # validate the SHAPE, so no payload can reach a git command as a ref.
        run: |
          tag=""
          if out="$(gh api -H "Cache-Control: no-cache" \
                    "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            tag="$out"
          fi
          case "$tag" in
            null) tag="" ;;
            *[!A-Za-z0-9._-]*)
              echo "Unexpected payload where a tag was expected; treating" >&2
              echo "as 'no baseline' rather than passing it to git." >&2
              tag=""
              ;;
          esac
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release exists yet, so there is no baseline to compare"
            echo "against. This becomes a real gate once release.yml cuts one."
            {
              echo "### Test speed"
              echo
              echo "Skipped: no release exists yet to use as a baseline."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Baseline: $tag"
          fi

      - name: Check out this commit
        if: steps.baseline.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the baseline release
        if: steps.baseline.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: base
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.baseline.outputs.tag != ''
        with:
          python-version: "3.13"
          cache: pip

      - name: Build one virtualenv per side
        if: steps.baseline.outputs.tag != ''
        # Separate environments because the two sides pin different versions,
        # and a shared one would silently benchmark whichever resolved last
        # against both trees.
        run: |
          for side in base head; do
            python -m venv "venv-$side"
            "venv-$side/bin/python" -m pip install --quiet --upgrade pip
            "venv-$side/bin/python" -m pip install --quiet \
              "./$side" "./$side[mcp]"
          done
          echo "base mcp:"; "venv-base/bin/python" -m pip show mcp | head -2
          echo "head mcp:"; "venv-head/bin/python" -m pip show mcp | head -2

      - name: Run both suites, interleaved
        if: steps.baseline.outputs.tag != ''
        # A failing test does NOT fail this job: tests.yml owns that verdict,
        # and a non-passing test is simply absent from the side's durations and
        # drops out of the intersection. What this step must guarantee is that
        # THIS COMMIT produced usable reports, so it checks for those
        # explicitly rather than trusting an exit code it deliberately ignores.
        # The baseline's directories are allowed to be empty — a release from
        # before run_tests.py recorded durations cannot fill them.
        run: |
          mkdir -p reports
          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              echo "::group::$side round $round"
              out="$GITHUB_WORKSPACE/reports/$side-$round"
              mkdir -p "$out"
              ( cd "$side" && DAEDALUS_TEST_SUMMARY_DIR="$out" \
                  "$GITHUB_WORKSPACE/venv-$side/bin/python" run_tests.py ) \
                && echo "$side round $round: all passed" \
                || echo "$side round $round: some tests did not pass (excluded)"
              echo "::endgroup::"
            done
          done

          missing=0
          for round in $(seq 1 "$ROUNDS"); do
            if ! ls "reports/head-$round"/*.json >/dev/null 2>&1; then
              echo "MISSING: reports/head-$round has no summaries" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "This commit's suite produced no summaries — it did not run" >&2
            echo "at all, which is a setup failure, not a speed result." >&2
            exit 1
          fi
          ls -la reports/*/

      - name: Compare
        if: steps.baseline.outputs.tag != ''
        env:
          BASE_TAG: ${{ steps.baseline.outputs.tag }}
        # The comparator comes from the HEAD checkout, so an improvement to the
        # comparison itself takes effect on the commit that makes it rather
        # than one release later.
        run: |
          # shellcheck disable=SC2046
          python3 head/scripts/ci/compare_durations.py \
            --base $(ls -d reports/base-*) \
            --head $(ls -d reports/head-*) \
            --max-regression "$MAX_REGRESSION" \
            --base-label "$BASE_TAG" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload the duration summaries
        if: ${{ !cancelled() && steps.baseline.outputs.tag != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: speed-durations
          path: reports/
          if-no-files-found: warn
