name: audit

# Dependency vulnerability gate: pip-audit resolves each requirements file
# to its full transitive tree and checks every resolved version against the
# PyPI advisory database.
#
# FOUR SURFACES, and none of them is the wheel. The published CLI declares
# `dependencies = []` — stdlib only, deliberately — so `pip-audit .` over this
# project collects zero packages and would be a gate that can never fire.
# What this repository actually depends on is:
#
#   * the `mcp` extra in pyproject.toml, which the MCP server imports at
#     runtime and is the only third-party code that executes in production;
#   * requirements-dev.txt, the lint and type pins;
#   * requirements-test.txt, the coverage pin;
#   * requirements-pip-audit.txt, this gate's own tool.
#
# The last three never ship, but they run in CI holding the repository token,
# so a compromised one is a supply-chain problem even though no user installs
# it.
#
# ONE MANIFEST IS DELIBERATELY ABSENT. requirements-zizmor.txt is
# hash-pinned, and pip's hash checking is a property of the whole resolution
# rather than of one file, so a hashed manifest cannot share this one
# invocation with the unpinned three: it would drag every other surface into
# hash mode and fail on hashes they do not carry. It is installed by its own
# step in tests.yml, which touches no other manifest.
#
# THE EXTRAS ARE DERIVED, NOT LISTED. The audit reads every extra out of
# pyproject.toml rather than naming `mcp`, so adding a second extra cannot
# quietly escape the gate — the failure mode a hand-maintained list has is
# that it stays correct-looking while the thing it mirrors moves.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. Every other gate here answers "did
# this commit break something", so push is the natural trigger. This one
# answers "is a version we froze months ago still safe", and that answer
# changes when a stranger publishes an advisory, with no commit here to hang
# it on. A push-only audit would report clean forever on a quiet branch. The
# push trigger is the lesser half: it catches a bad pin at the moment it is
# introduced, while the diff is on screen.
#
# This gate FAILS the build rather than filing an advisory, which is the same
# stance as lint and types: a red gate a human must look at beats a
# notification that accumulates unread. When a fix genuinely is not available
# yet, add the advisory to --ignore-vuln below WITH a comment saying why and
# what would clear it — never silence the whole gate.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # Release checks require a run on every taggable commit. Keep audit
    # unfiltered when other workflows skip threshold-only pushes.
  pull_request:
  schedule:
    # Off the hour, and not 03:47, which is codeql's slot.
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # Every other workflow bounds its jobs; this one inherited GitHub's
    # 360-minute default. It also runs on a daily schedule, so a package index
    # that stops responding mid-request could hold a runner for up to six hours
    # rather than failing in minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        # Pinned in a manifest at the repository root rather than in this
        # `run:` block, because Dependabot's `pip` entry reads manifest files
        # and never a workflow. See that manifest for why it is not
        # hash-pinned, and this file's header for why it is audited below
        # while requirements-zizmor.txt is not.
        run: |
          pip install -r requirements-pip-audit.txt

      - name: Collect the optional-dependency surface
        # Every extra, not the one this repo happens to have today.
        run: |
          python - <<'PY' > extras-requirements.txt
          import pathlib
          import tomllib

          data = tomllib.loads(
              pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          for requirements in data['project']['optional-dependencies'].values():
              for requirement in requirements:
                  print(requirement)
          PY
          cat extras-requirements.txt
          # An empty file here would narrow the gate in silence — pip-audit
          # accepts it, reports the other two surfaces clean, and the extra
          # that carries every third-party import at runtime goes unchecked.
          if [ ! -s extras-requirements.txt ]; then
            echo "pyproject.toml declares no extras, so this workflow is" >&2
            echo "auditing less than it claims to. Fix the reader or drop" >&2
            echo "this step deliberately." >&2
            exit 1
          fi

      - name: Audit dependencies
        # All four surfaces in one invocation so a package constrained by
        # more than one of them is resolved once, consistently — the same way
        # an install would see it.
        #
        # No --ignore-vuln entries at present. Each one added here must carry
        # a comment naming the advisory, why it is not fixable, and what would
        # let it be removed.
        #
        # THE RETRY IS NARROW ON PURPOSE, AND THE ORDER IS THE NARROWNESS.
        # pip-audit resolves against PyPI and the advisory database over the
        # network, and a transport failure produces the same exit status as a
        # real finding, so something has to tell them apart. A blanket
        # `retry 3` would re-run a genuine vulnerability three times before
        # reporting it, and — worse — a gate that goes red for reasons
        # unrelated to its subject is one people learn to ignore.
        #
        # So there are exactly five outcomes, and the block reaches all five:
        #
        #   * a clean run exits 0 and prints the output;
        #   * a real finding matches neither test below and is reported
        #     immediately and verbatim;
        #   * a 4xx that is not a 429 is the index answering about THIS
        #     request rather than about the network, so it is reported at
        #     once. It is tested FIRST, which is what keeps the widening
        #     narrow: every other 4xx leaves before the retry test is read,
        #     and only a 429 — the one 4xx that means "come back later" —
        #     falls through to it;
        #   * a transport failure or a 5xx matches the retry test, and each
        #     attempt backs off further;
        #   * three retries exhausted exits 1 saying so, with the output.
        #
        # Every arm above is pinned by a fixture in tests/_wffixtures.py,
        # which runs this block rather than reading it, and asserts on what it
        # printed as well as on how many times it ran and what it exited with.
        run: |
          for attempt in 1 2 3; do
            if pip-audit \
                 --progress-spinner off \
                 --requirement extras-requirements.txt \
                 --requirement requirements-dev.txt \
                 --requirement requirements-test.txt \
                 --requirement requirements-pip-audit.txt \
                 > audit.out 2>&1; then
              cat audit.out
              exit 0
            fi

            # A 4xx the index is not going to answer differently on the next
            # attempt, so it is reported rather than retried. The 429 exception
            # is scoped to the SAME LINE the 4xx test matched: a whole-file
            # search reads a 429 somewhere else in the output — an advisory
            # version, an unrelated service line — as this one being
            # retryable, and retries the 4xx three times instead.
            if grep -E '4[0-9][0-9] Client Error' audit.out |
               grep -qv '429'; then
              echo "pip-audit got a 4xx from the index it will not repeat:" >&2
              cat audit.out >&2
              exit 1
            fi

            if grep -qiE 'SSLError|Could not connect to (PyPI|OSV).*vulnerability feed|connection (abort|aborted|reset|error)|read timed out|temporary failure in name resolution|5[0-9][0-9] (Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)|429 (Client Error|Too Many Requests)|ServiceError' audit.out; then
              echo "attempt $attempt: index failure talking to PyPI, retrying"
              tail -n 5 audit.out
              sleep $(( attempt * 15 ))
              continue
            fi

            echo "pip-audit reported findings:" >&2
            cat audit.out >&2
            exit 1
          done

          echo "pip-audit could not reach PyPI after 3 attempts:" >&2
          cat audit.out >&2
          exit 1

  # tests.yml and codeql.yml skip pushes that touch only
  # .github/ci-thresholds.json; this unfiltered workflow validates it.
  thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the threshold document
        run: python3 scripts/ci/thresholds.py --check
