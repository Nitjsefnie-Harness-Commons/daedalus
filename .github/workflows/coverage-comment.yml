name: coverage comment

# Post the patch-coverage comment after the tests workflow succeeds.
#
# WHY THIS IS A SEPARATE WORKFLOW. `tests` checks out and executes the
# proposed tree, so that job must not also hold the token that can write pull
# request conversation. Only the rendered comment crosses this boundary; this
# workflow checks out nothing and runs no code from the pull request.
#
# The DESTINATION does not cross it either. The artifact carries a pull
# request number, but that artifact is written by a job running the pull
# request's own copy of `tests.yml`, so obeying it would let any pull request
# aim bot-authored text at any other one. The number below is resolved from
# the `workflow_run` event instead, and the artifact's copy is only compared
# with it — a disagreement fails the step loudly rather than being corrected
# quietly, because it is the signal that somebody tried.
#
# `pull_request_target` is not the answer. As `speed.yml` explains, that
# trigger would give a run of proposed code the base repository's token and
# secrets. The workflow_run split keeps the write-capable job on this trusted
# file while the untrusted job stays read-only.

# zizmor calls `workflow_run` fundamentally insecure, and it is right about
# the usual shape: a run that checks out the pull request, or runs something
# the pull request produced, while holding a write token. This one does
# neither. It has no `actions/checkout` at all, it executes nothing from the
# artifact, and the only thing crossing from the pull request is the TEXT of
# a comment. The alternative zizmor would leave standing is the job that runs
# proposed code holding `pull-requests: write` itself, which is worse.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [tests]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

concurrency:
  # Per head branch of the triggering run, and cancel-in-progress unlike
  # `claim.yml`: two `tests` runs for one branch finishing close together
  # would otherwise each find no existing comment and both post. Only the
  # newest measurement is worth having, so the older run is cancelled rather
  # than queued. The head repository and branch are what a `workflow_run`
  # event exposes at workflow level; the pull request number is not resolved
  # until the job's steps run.
  group: >-
    coverage-comment-${{
    github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    # Only a successful run. A red suite means the coverage run may have
    # measured a partial pass — a failing suite contributes no hits — so a
    # percentage derived from it would understate what the change actually
    # covers, and a wrong number is worse than no number on the one comment
    # whose entire job is to state one.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for the comment artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # The lookup is its own command, and pipefail is load-bearing: in
          # `x="$(gh api ... | jq ...)"` the status is jq's, so a failed API
          # call would print `false` and be reported as "no artifact" — the
          # comment silently never appears and nothing goes red.
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.[]' > artifacts.json
          then
            echo "listing the artifacts of run $RUN_ID failed" >&2
            exit 1
          fi
          # Collect every paginated object into one array before selecting.
          present="$(jq -s 'any(.[]; .name == "diff-coverage-comment" and
            .expired == false)' artifacts.json)"
          case "$present" in
            true) echo 'present=true' >> "$GITHUB_OUTPUT" ;;
            false)
              echo 'diff-coverage-comment is absent; nothing to post.'
              ;;
            *)
              echo "unexpected artifact lookup result: $present" >&2
              exit 1
              ;;
          esac

      - name: Resolve the target pull request from the event
        id: pr
        if: steps.artifact.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NUMBERS: >-
            ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          set -euo pipefail

          # Deliberately before the download: the destination is settled
          # while nothing the pull request produced is on disk.
          numbers="$(printf '%s' "$EVENT_NUMBERS" | jq -r 'arrays | .[]' \
            | sort -u)"
          if [ -z "$numbers" ]; then
            # A fork pull request arrives with an empty `pull_requests`, so
            # ask which pull request owns the head commit instead.
            if ! gh api -H 'Cache-Control: no-cache' --paginate \
              "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[].number' > pulls.txt
            then
              echo "listing the pull requests for $HEAD_SHA failed" >&2
              exit 1
            fi
            numbers="$(sort -u pulls.txt)"
          fi
          count="$(printf '%s\n' "$numbers" | awk 'NF' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "expected one pull request for $HEAD_SHA, found $count" >&2
            printf '%s\n' "$numbers" >&2
            exit 1
          fi
          case "$numbers" in
            ''|*[!0-9]*)
              echo "resolved a non-numeric pull request: $numbers" >&2
              exit 1
              ;;
          esac
          echo "number=$numbers" >> "$GITHUB_OUTPUT"

      - name: Download the comment artifact
        if: steps.artifact.outputs.present == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: diff-coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the pull request comment
        if: steps.artifact.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          test -f body.md
          test -f pr-number.txt

          # Checked, never obeyed. See the header: the producer is untrusted.
          claimed="$(cat pr-number.txt)"
          if [ "$claimed" != "$PR_NUMBER" ]; then
            echo "the artifact names pull request '$claimed' but the run" \
              "belongs to '$PR_NUMBER'; refusing to post" >&2
            exit 1
          fi

          # The comment API caps a body at 65536 characters. A silently
          # truncated coverage report is a wrong coverage report, so an
          # oversized body is refused rather than trimmed to fit.
          size="$(wc -c < body.md)"
          if [ "$size" -gt 60000 ]; then
            echo "body.md is $size bytes, past the comment limit" >&2
            exit 1
          fi

          marker='<!-- daedalus-diff-coverage -->'
          { printf '%s\n' "$marker"; cat body.md; } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $PR_NUMBER failed" >&2
            exit 1
          fi
          # Slurped, so pagination cannot yield one id per page, and the
          # body is defaulted, so a null one is not an abort mid-select.
          existing="$(
            jq -s 'map(select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith(
                "<!-- daedalus-diff-coverage -->")))) |
              .[0].id // empty' comments.json
          )"
          case "$existing" in
            '')
              gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
                -F body=@comment.md >/dev/null
              echo 'posted a new comment'
              ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "updated comment $existing"
              ;;
          esac
