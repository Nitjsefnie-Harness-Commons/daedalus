name: coverage comment

# Post or invalidate the patch-coverage comment after the tests workflow.
#
# WHY THIS IS A SEPARATE WORKFLOW. `tests` checks out and executes the
# proposed tree, so that job must not also hold the token that can write pull
# request conversation. Only the rendered comment crosses this boundary; this
# workflow checks out nothing and runs no code from the pull request.
#
# The DESTINATION does not cross it either. The artifact carries a pull
# request number, but that artifact is written by a job running the pull
# request's own copy of `tests.yml`, so obeying it would let any pull request
# aim bot-authored text at any other one. The number below is resolved from
# the `workflow_run` event instead, and the artifact's copy is only compared
# with it — a disagreement fails the step loudly rather than being corrected
# quietly, because it is the signal that somebody tried.
#
# `pull_request_target` is not the answer. As `tests.yml` explains, that
# trigger would give a run of proposed code the base repository's token and
# secrets. The workflow_run split keeps the write-capable job on this trusted
# file while the untrusted job stays read-only.

# zizmor calls `workflow_run` fundamentally insecure, and it is right about
# the usual shape: a run that checks out the pull request, or runs something
# the pull request produced, while holding a write token. This one does
# neither. It has no `actions/checkout` at all, it executes nothing from the
# artifact, and the only thing crossing from the pull request is the TEXT of
# a comment. The alternative zizmor would leave standing is the job that runs
# proposed code holding `pull-requests: write` itself, which is worse.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [tests]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  checks: write

concurrency:
  # Per head branch of the triggering run, and cancel-in-progress unlike
  # `claim.yml`: two `tests` runs for one branch finishing close together
  # would otherwise each find no existing comment and both post. Only the
  # newest measurement is worth having, so the older run is cancelled rather
  # than queued. The head repository and branch are what a `workflow_run`
  # event exposes at workflow level; the pull request number is not resolved
  # until the job's steps run.
  group: >-
    coverage-comment-${{
    github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    # Every completed run gets a chance to replace an old percentage with a
    # plainly labelled "not measured" marker. Otherwise a red or cancelled
    # run leaves the previous commit's number looking current.
    if: >-
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for the comment artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # The lookup is its own command, and pipefail is load-bearing: in
          # `x="$(gh api ... | jq ...)"` the status is jq's, so a failed API
          # call would print `false` and be reported as "no artifact" — the
          # comment silently never appears and nothing goes red.
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[]' > artifacts.json
          then
            echo "listing the artifacts of run $RUN_ID failed" >&2
            exit 1
          fi
          # Collect every paginated object into one array before selecting.
          present="$(jq -s 'any(.[]; .name == "diff-coverage-comment" and
            .expired == false)' artifacts.json)"
          case "$present" in
            true) echo 'present=true' >> "$GITHUB_OUTPUT" ;;
            false)
              echo 'diff-coverage-comment is absent; nothing to post.'
              ;;
            *)
              echo "unexpected artifact lookup result: $present" >&2
              exit 1
              ;;
          esac

      - name: Resolve the target pull request from the event
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_NUMBERS: >-
            ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          set -euo pipefail

          # Deliberately before the download: the destination is settled
          # while nothing the pull request produced is on disk.
          numbers="$(printf '%s' "$EVENT_NUMBERS" | jq -r 'arrays | .[]' \
            | sort -u)"
          if [ -z "$numbers" ]; then
            # A fork pull request arrives with an empty `pull_requests`, and
            # the base repository does not associate its head commit with a
            # pull request, so ask the head repository which one owns it.
            if ! gh api -H 'Cache-Control: no-cache' --paginate \
              "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[].number' > pulls.txt
            then
              echo "listing the pull requests for $HEAD_SHA failed" >&2
              exit 1
            fi
            numbers="$(sort -u pulls.txt)"
          fi
          count="$(printf '%s\n' "$numbers" | awk 'NF' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "expected one pull request for $HEAD_SHA, found $count" >&2
            printf '%s\n' "$numbers" >&2
            exit 1
          fi
          case "$numbers" in
            ''|*[!0-9]*)
              echo "resolved a non-numeric pull request: $numbers" >&2
              exit 1
              ;;
          esac
          if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
            "repos/$REPO/pulls/$numbers" --jq '.head.sha')"
          then
            echo "reading the current head of pull request $numbers failed" \
              >&2
            exit 1
          fi
          if [ -z "$current_sha" ]; then
            echo "pull request $numbers has no current head SHA" >&2
            exit 1
          fi
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "run $HEAD_SHA is stale; current pull request head is " \
              "$current_sha"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$numbers" >> "$GITHUB_OUTPUT"
          echo 'stale=false' >> "$GITHUB_OUTPUT"

      - name: Mark missing patch coverage
        if: >-
          steps.artifact.outputs.present != 'true'
          && steps.pr.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          marker='<!-- daedalus-diff-coverage -->'
          {
            printf '%s\n\n' "$marker"
            printf 'Patch coverage was not measured for commit %s.\n' \
              "$HEAD_SHA"
          } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $PR_NUMBER failed" >&2
            exit 1
          fi
          existing="$(
            jq -s 'map(select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith(
                "<!-- daedalus-diff-coverage -->")))) |
              .[0].id // empty' comments.json
          )"
          revalidate_head() {
            if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
              "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
            then
              echo "reading the current head of pull request $PR_NUMBER" \
                "failed" >&2
              exit 1
            fi
            if [ -z "$current_sha" ]; then
              echo "pull request $PR_NUMBER has no current head SHA" >&2
              exit 1
            fi
            if [ "$current_sha" != "$HEAD_SHA" ]; then
              echo "run $HEAD_SHA is stale; current pull request head is " \
                "$current_sha"
              return 1
            fi
          }
          case "$existing" in
            '') echo 'no patch-coverage marker to update'; exit 1 ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "marked patch coverage as unavailable for $HEAD_SHA"; exit 1
              ;;
          esac

      - name: Download the comment artifact
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
        # actions/download-artifact v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diff-coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the pull request comment
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          test -f body.md
          test -f pr-number.txt

          # Checked, never obeyed. See the header: the producer is untrusted.
          claimed="$(cat pr-number.txt)"
          if [ "$claimed" != "$PR_NUMBER" ]; then
            echo "the artifact names pull request '$claimed' but the run" \
              "belongs to '$PR_NUMBER'; refusing to post" >&2
            exit 1
          fi

          # The comment API caps a body at 65536 characters. A silently
          # truncated coverage report is a wrong coverage report, so an
          # oversized body is refused rather than trimmed to fit.
          size="$(wc -c < body.md)"
          if [ "$size" -gt 60000 ]; then
            echo "body.md is $size bytes, past the comment limit" >&2
            exit 1
          fi

          marker='<!-- daedalus-diff-coverage -->'
          {
            printf '%s\n\n' "$marker"
            printf 'Patch coverage for commit %s.\n\n' "$HEAD_SHA"
            cat body.md
          } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $PR_NUMBER failed" >&2
            exit 1
          fi
          # Slurped, so pagination cannot yield one id per page, and the
          # body is defaulted, so a null one is not an abort mid-select.
          existing="$(
            jq -s 'map(select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith(
                "<!-- daedalus-diff-coverage -->")))) |
              .[0].id // empty' comments.json
          )"
          revalidate_head() {
            if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
              "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
            then
              echo "reading the current head of pull request $PR_NUMBER" \
                "failed" >&2
              exit 1
            fi
            if [ -z "$current_sha" ]; then
              echo "pull request $PR_NUMBER has no current head SHA" >&2
              exit 1
            fi
            if [ "$current_sha" != "$HEAD_SHA" ]; then
              echo "run $HEAD_SHA is stale; current pull request head is " \
                "$current_sha"
              return 1
            fi
          }
          case "$existing" in
            '')
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
                -F body=@comment.md >/dev/null
              echo 'posted a new comment'
              ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "updated comment $existing"
              ;;
          esac

      - name: Publish coverage check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          case "$STATUS" in
            success|failure|cancelled) ;;
            *)
              echo "unexpected workflow-run conclusion: $STATUS" >&2
              exit 1
              ;;
          esac

          external_id="daedalus-coverage-comment/v1/$HEAD_SHA"
          if ! gh api --method GET -H 'Cache-Control: no-cache' --paginate \
            "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            -f filter=all -f per_page=100 \
            --jq '.check_runs[]' > check-runs.json
          then
            echo "listing coverage comment checks for $HEAD_SHA failed" >&2
            exit 1
          fi
          if ! jq -s --arg name 'coverage comment' \
            --arg external_id "$external_id" \
            'map(select(.name == $name and
              .external_id == $external_id and
              .app.slug == "github-actions") | .id) | .[]' \
            check-runs.json > check-ids.txt
          then
            echo "decoding coverage comment checks failed" >&2
            exit 1
          fi
          while IFS= read -r check_id; do
            check_id="${check_id%$'\r'}"
            case "$check_id" in
              ''|*[!0-9]*)
                echo "coverage comment check id is not only digits:" \
                  "$check_id" >&2
                exit 1
                ;;
            esac
          done < check-ids.txt

          write_check() {
            local method="$1"
            local target="$2"
            local -a args=(
              -X "$method" "$target"
              -f name='coverage comment'
              -f status=completed
              -f conclusion="$STATUS"
              -f external_id="$external_id"
              -f details_url="$RUN_URL"
            )
            if [ "$method" = POST ]; then
              args+=( -f head_sha="$HEAD_SHA" )
            fi
            if ! gh api "${args[@]}" >/dev/null
            then
              echo "publishing coverage comment check failed:" \
                "$method $target" >&2
              return 1
            fi
          }

          if [ ! -s check-ids.txt ]; then
            write_check POST "repos/$REPO/check-runs"
            echo "created coverage comment check for $HEAD_SHA"
          else
            while IFS= read -r check_id; do
              check_id="${check_id%$'\r'}"
              write_check PATCH "repos/$REPO/check-runs/$check_id"
            done < check-ids.txt
            echo "updated coverage comment checks for $HEAD_SHA"
          fi
