name: tests

# A matrix, because the suites start the real bridge and talk to it over
# loopback: socket behaviour, path spelling, temp-dir aliasing (macOS resolves
# /var to /private/var) and process teardown all differ per platform, and all
# four are load-bearing here.
#
# The bridge and the CLI are stdlib-only on purpose. The MCP server is the one
# part with dependencies, so the matrix installs the package and its mcp extra
# rather than letting that suite skip.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # Ratchet commits change only this data; audit still gates those pushes.
    # The journey budget's counts, comment-share and size records join them,
    # and test-ratchet's records commit writes the test times beside the
    # thresholds: a ratchet commit changes only these files, and its ratchet
    # already ran.
    paths-ignore:
      - '.github/ci-thresholds.json'
      - '.github/journey-budget.json'
      - '.github/comment-share.json'
      - '.github/size-baseline.json'
      - '.github/test-times.json'
    # release.yml needs a run on the tagged SHA; audit remains unfiltered.
    #
    # Documentation-only runs are narrowed inside the workflow instead, by
    # the classifier's docs_only output: one suite cell runs, and the
    # required checks still report.
  # `pull_request`, never `pull_request_target`: journey-budget RUNS the
  # proposed code; the latter runs it with a writable token and base secrets.
  # BASE FILTER. A non-main base's green would survive a retarget to main.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: without an explicit block a job inherits the
# repository default, which can be write for the whole token.
# Every checkout sets persist-credentials: false: nothing here pushes,
# and a token left in .git/config is reusable by later steps in its job.
permissions:
  contents: read

# Per-commit groups on push and workflow_dispatch: a landed main SHA's
# verdict must complete, so neither a newer push nor a re-run of an older
# SHA may cancel it — under github.ref every main push would share one
# group and the newer run would cancel the incumbent. pull_request events
# carry pull_request.number, so a PR keeps one group per number and a
# superseded head push is still cancelled. Push and workflow_dispatch of
# the same commit share that commit's group, and the later run supersedes
# the earlier's verdict — a dispatch runs the full matrix even where a
# docs-only push ran the reduced documentation matrix — no verdict is lost.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Documentation-only runs pay for one suite cell. The
  # pull_request trigger has no path filter, so required checks still report;
  # this job reads the changed paths and emits the suites matrix and a
  # docs_only flag instead, and every fallback over-runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one rather than adding
    # to it: the pulls/<n>/files read needs pull-requests, nothing more.
    permissions:
      contents: read  # the checkout and the push compare read
      pull-requests: read  # the pulls/<n>/files read
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      workflows: ${{ steps.classify.outputs.workflows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          DAEDALUS_PR_NUMBER: ${{ github.event.pull_request.number }}
          DAEDALUS_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci/classify_changes.py

  # Two gates, one job each so a failure says which tool found it.
  #
  # Style opinions stay off (max-line-length = 10000 in setup.cfg, and
  # .pylintrc disables the formatting and metric checks): these exist for
  # real defects, not formatting preferences. Every disable in .pylintrc
  # names the pattern it is there for.
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      # The pip cache is restored on every event and saved only from a push
      # of main, as in the test job. `cache: pip` saves in
      # a post-job step running after the pull-request checkout, the
      # poisoning shape that job avoids. The key shares the test job's 3.15
      # namespace: the cache holds fetched packages, so what one job warmed
      # any of them reuses.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      - name: Install linters
        run: |
          pip install -r requirements-dev.txt

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle

      # Only a push of main writes cross-run state, and a cancelled run
      # never reaches this step; nothing between the install and here runs
      # pip, so the position after the lint run decides who writes a cache,
      # never what it holds.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      # Restored as in the pycodestyle job, for the same reasons.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      # The MCP server's dependencies are installed for the same reason as in
      # the pyright job: pylint resolves imports, so without them every httpx,
      # mcp, starlette and uvicorn line in daedalus_mcp/server.py (and httpx in
      # scripts/mcp_probe.py) reports as import-error instead of being checked.
      # The suites likewise import the pytest and PyYAML pinned in
      # requirements-test.txt.
      - name: Install linters and import dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt --only-binary=:all: --no-binary=PyYAML
          pip install ".[mcp]"

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc

      # Saved as in the pycodestyle job, for the same reasons.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}

  # pyright runs over two scopes. This job checks the bridge, the CLI and the
  # scripts under pyrightconfig.json, which excludes the suites: they load
  # their target by path and reach into module internals on purpose, which a
  # type checker can only ever call an error. A second scope,
  # pyrightconfig.tests.json, checks the suites themselves, and the type error
  # ratchet below is what keeps that scope measured. A file belongs to exactly
  # one: a suite in the second, everything else in the first.
  #
  # pythonPlatform is "All" rather than the runner's: the bridge branches on
  # platform at runtime, and those branches should be checked wherever this
  # runs.
  #
  # The `mcp` extra is installed for one reason: daedalus_mcp/server.py imports
  # httpx, starlette and the MCP SDK, and without them every line that touches
  # them reads as an unresolved import rather than as code anyone checked.
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      - name: Resolve threshold base
        env:
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DAEDALUS_EVENT: ${{ github.event_name }}
          DAEDALUS_BEFORE: ${{ github.event.before }}
        run: python scripts/ci/threshold_base.py

      # Restored as in the pycodestyle job, for the same reasons.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      - name: Install the type checker and the dependencies it resolves
        # The suites' scope imports the pytest and PyYAML pinned in
        # requirements-test.txt, so those pins belong here as well as in the
        # job that runs them. An unresolved import is a type error.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt --only-binary=:all: --no-binary=PyYAML
          pip install ".[mcp]"

      - name: pyright
        run: pyright

      - name: type error ratchet
        run: python3 scripts/ci/type_error_baseline.py

      # Saved as in the pycodestyle job, for the same reasons.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('requirements-*.txt') }}

  # pycodestyle and pylint run over *.py and pyright checks types; this job
  # gives the extension service worker, the page relay and the dashboard
  # modules static analysis of their own.
  #
  # The value here is no-undef and no-unused-vars — a typo'd identifier in
  # the service worker should be found by CI rather than by a user whose
  # browser silently stopped relaying. Stylistic rules stay off, consistent
  # with the Python gate, which turns its formatting checks off for the same
  # reason.
  #
  # There is deliberately NO package.json: the versions are pinned right here
  # and installed with --no-save, so the repository does not read as having
  # adopted a build step it does not have. The job also checks every pin
  # against its own registry: an out-of-date major fails the job, so no pin
  # can silently rot.
  #
  # examples/ is NOT linted, and that is a real gap rather than an oversight.
  # Those files are snippets the bridge wraps in an async function before
  # running, so they carry top-level `return` AND top-level `await` together.
  # No espree sourceType describes that shape: `script` rejects the await,
  # `module` rejects the return. They are excluded in eslint.config.js so a
  # local run agrees with this one, and the file list below excludes them too
  # so the run is silent rather than six ignore warnings deep.
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # One copy of each pin, read by the install step and by the currency
      # check, so the installed version and the checked version cannot
      # diverge. @eslint/js carries the recommended rules and globals the
      # browser/serviceworker environments; eslint itself depends on neither.
      DAEDALUS_ESLINT_VERSION: "10.9.1"
      DAEDALUS_ESLINT_JS_VERSION: "10.0.1"
      DAEDALUS_GLOBALS_VERSION: "17.12.0"

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: >-
          actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install eslint (pinned, no package.json, no build step)
        # zizmor: ignore[adhoc-packages]
        # The finding is "installs packages outside of a lockfile", and the
        # absence of a lockfile is the deliberate design documented above: a
        # package.json here would read as this repository having adopted a
        # build step, which it has not. Every package in this command is
        # pinned to an exact version; what stays unpinned is their transitive
        # graph, and that residual drift is accepted -- the currency check
        # below exists because the top-level pin itself is what rots.
        run: >-
          npm install --no-save --no-package-lock --no-audit --no-fund
          "eslint@${DAEDALUS_ESLINT_VERSION}"
          "@eslint/js@${DAEDALUS_ESLINT_JS_VERSION}"
          "globals@${DAEDALUS_GLOBALS_VERSION}"

      # Three pins ride one install command, so one of them rotting is
      # enough to break the job: each is compared here with its own
      # registry's latest stable major, a pin that has drifted away fails
      # the job instead of passing an error it swallowed, and a query that
      # cannot answer fails the job rather than passing a pin it never
      # saw. Compare majors, not patch versions: staying current within a
      # major is npm's business between runs, while a new major is the
      # maintainer's call.
      - name: Check the pins against the registries' latest majors
        run: |
          stale=0
          drift=0
          for pin in \
            "DAEDALUS_ESLINT_VERSION:eslint" \
            "DAEDALUS_ESLINT_JS_VERSION:@eslint/js" \
            "DAEDALUS_GLOBALS_VERSION:globals"
          do
            var="${pin%%:*}"
            package="${pin#*:}"
            pinned="${!var}"
            # A renamed or deleted env pin resolves empty, and an empty pin
            # makes the -gt comparison error inside its own if, which reads
            # as "not stale". Fail instead, naming the variable.
            if [ -z "${pinned}" ]; then
              echo "${var} is unset or empty, so ${package} has no pin" \
                "to check." >&2
              drift=1
              continue
            fi
            latest="$(npm view "${package}" version)"
            pinned_major="${pinned%%.*}"
            latest_major="${latest%%.*}"
            echo "pinned ${package}@${pinned}; registry latest ${latest}"
            if [ "${latest_major}" -gt "${pinned_major}" ]; then
              echo "${package} ${latest} is out," \
                "and the pin ${var}=${pinned} is a major behind it." >&2
              stale=1
            fi
          done
          if [ "${drift}" -ne 0 ]; then
            echo "Restore the named env pins so every installed package" >&2
            echo "has a pin this job checks." >&2
            exit 1
          fi
          if [ "${stale}" -ne 0 ]; then
            echo "Raise the named env pins, and eslint.config.js with" >&2
            echo "them if the new majors need config changes, then re-run" >&2
            echo "this job." >&2
            exit 1
          fi

      - name: eslint
        # git ls-files, so the list is the tracked tree rather than a glob
        # someone has to remember to widen. The pathspec excludes examples/
        # for the reason above, and the emptiness check keeps a list that
        # matched nothing from reading as a clean lint.
        run: |
          mapfile -t sources < <(git ls-files '*.js' ':!:examples/*')
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "no JavaScript matched; refusing to report a clean lint" >&2
            exit 1
          fi
          printf 'linting %d files\n' "${#sources[@]}"
          npx --no-install eslint "${sources[@]}"

  # The gate on the gates. Everything else in .github/workflows is unreviewed
  # code that runs with a repository token, and a mistake in it fails in ways
  # the other gates structurally cannot catch: a workflow with a typo in an
  # `if:` expression does not go red, it silently stops running.
  #
  # Two tools, because they answer different questions:
  #
  #   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
  #   context availability (`github.event.review` on a push event), `runs-on`
  #   labels, and shellcheck over every `run:` block, which is where most real
  #   bugs live.
  #
  #   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
  #   `run:` block, over-broad `permissions:`, credential persistence after
  #   checkout, unpinned action references.
  #
  # Both tools are pinned, and actionlint is verified by checksum rather than
  # trusted from the release page: a linter that runs before every other gate
  # is a supply-chain position worth defending.
  #
  # The checksum below is recorded HERE rather than read from the release's own
  # checksums file, which is the property that matters: it is a value this
  # repository decides and anyone reviewing this line can check, rather than a
  # value republished by whoever published the binary. The actionlint build
  # comes from a fork of ours, so the checksum file beside the asset is written
  # by the same party as the asset. Upstream's release is not immutable either,
  # so the delta is who holds write access, not whether the tag can move.
  #
  # A suppression belongs at the offending line as a `# zizmor: ignore[rule]`
  # comment with a justification, never as a raised threshold here — a
  # threshold silences the next finding too, and the next one is the one
  # nobody has thought about yet.
  actionlint:
    needs: changes
    if: ${{ github.event_name == 'push'
            || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # A fork build, not an upstream release. v1.7.12 is the latest upstream
      # tag and it rejects `queue` under `concurrency`, a key GitHub documents,
      # so the key cannot be expressed in a workflow here. 1.7.12-queue.1 is
      # the v1.7.12 TAG plus rhysd/actionlint#654 cherry-picked unchanged, so
      # the source delta from upstream v1.7.12 is exactly that patch. The
      # binaries are not byte-identical to upstream's asset: this one is built
      # with go1.26.4 and upstream's v1.7.12 with go1.26.1.
      #
      # When #654 merges and ships upstream, move this back to an upstream
      # version string, the rhysd release URL below, and the checksum above
      # with them. The fork lags upstream by the ten commits merged after the
      # v1.7.12 tag, two of which are behavioural (service-container
      # `entrypoint`/`command`, and a darwin shellcheck deadlock fix), so
      # returning to upstream is a pin change and no merge.
      DAEDALUS_ACTIONLINT_VERSION: 1.7.12-queue.1
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz, from the
      # release's own checksums file. Bump both together.
      DAEDALUS_ACTIONLINT_SHA256: >-
        dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the install
        # script: piping a fetch into a shell would make this job trust
        # whatever that URL serves at run time. The transfer is bounded so a
        # hung mirror fails the step instead of holding the runner.
        run: |
          tarball="actionlint_${DAEDALUS_ACTIONLINT_VERSION}"
          tarball="${tarball}_linux_amd64.tar.gz"
          url='https://github.com/Nitjsefnie-OSC/actionlint/releases/download'
          url="${url}/v${DAEDALUS_ACTIONLINT_VERSION}/${tarball}"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            -o "$tarball" "$url"
          echo "${DAEDALUS_ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        # Pinned in a manifest at the repository root rather than in this
        # `run:` block, because Dependabot's `pip` entry reads manifest files
        # and never a workflow: a version written into a step is a version
        # nobody is ever told to move. `--require-hashes` because zizmor
        # gates the gates. This step installs that manifest and no other, so
        # the hash-pinned resolution stays its own.
        run: |
          pip install --require-hashes -r requirements-zizmor.txt

      - name: actionlint
        id: actionlint
        # Both extensions GitHub accepts, not just .yml. Pushes always run this
        # job; on other events the classifier runs it for every file under
        # .github/workflows and zizmor scans the whole directory, so a
        # workflow named .yaml must not start this gate and then be skipped by
        # it. nullglob keeps an extension nothing
        # matches from arriving as a literal pattern, and the emptiness check
        # keeps a directory with no workflows from reading as a clean lint —
        # which would move the silent pass rather than remove it.
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#workflows[@]} -eq 0 ]; then
            echo "no workflow files matched; refusing to report a clean lint" \
              >&2
            exit 1
          fi
          ./actionlint -color "${workflows[@]}"

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates —
        # the same shape the pylint and pycodestyle jobs use. Not when the
        # install itself failed, which would report a tool bug as a clean
        # audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/

      - name: Verify the actions/cache release annotations upstream
        # zizmor's impostor-commit audit proves a pinned SHA belongs to the
        # action's repository; only this proves it is the release the
        # comment beside it names. Runs when actionlint is red too, so one
        # push reports every gate this job holds.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cache_action_releases.py

  # The suites run through test-ratchet: `plan` splits the test files into
  # shards, `test` runs one shard per cell with Python and JavaScript
  # coverage measured, and `report` merges the shards, gates the floors in
  # .github/ci-thresholds.json and, on a push of main, commits the records
  # that rose with .github/test-times.json.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@916a819580fdb4133805bd7e4f46608849f05c7f  # v2.4.0
        with:
          tests: tests/**/test_*.py
          times: .github/test-times.json
          shards: 3

  test:
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
      - plan
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      # The os/python lists live in FULL_MATRIX in
      # scripts/ci/classify_changes.py, which the changes job renders:
      # one cell for a documentation-only run, all six otherwise. Each
      # cell runs every shard plan lists.
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.matrix).os }}
        python: ${{ fromJSON(needs.changes.outputs.matrix).python }}
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # A depth-1 checkout resolves neither origin/main nor a local
          # main, so tests that read the MERGE BASE's own definitions
          # refuse there and the property they check is never evaluated.
          # tests/test_workflow_job_timeouts.py pins this.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve threshold base
        env:
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DAEDALUS_EVENT: ${{ github.event_name }}
          DAEDALUS_BEFORE: ${{ github.event.before }}
        run: python scripts/ci/threshold_base.py

      # The suites this job runs skip on node, so it declares node rather
      # than inheriting whatever the hosted image happens to carry; a
      # job that reaches the suites and does not say so is the shape
      # test_ci_tool_declarations.py's declaration control refuses, and it reads
      # ORDER, so this step has to stay above the first suite-running one.
      # No package-manager cache: this job has no lockfile, and a cache
      # written here is cross-run state no gate on this event reaches.
      # actions/setup-node v7.1.0
      - uses: >-
          actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          package-manager-cache: false

      # The pip cache is restored on every event and saved only from a push of
      # main. Restore and save are separate steps so the event gate can sit
      # between them: `cache: pip` saves in a post-job step that runs after the
      # job has checked out and executed the code under test, so a pull-request
      # run could write what a later main run restores.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-

      # Without the MCP extra that suite skips. requirements-test.txt goes
      # into the interpreter the run step below installs its own toolchain
      # into, before it, so the pins it holds are the ones the suites see.
      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt --only-binary=:all: --no-binary=PyYAML

      # The suites drive real binaries, and a suite that finds one missing
      # SKIPS — on every leg, silently, so a job can be green having verified
      # nothing. This is the step that turns those skips into runs. It runs
      # after the install above so both tools are first on PATH: this step
      # installs each of them itself, at the pins that install names, so
      # what the suites find is what this step put there rather than what
      # the job happened to bring or what the runner image happened to ship.
      - name: Install the lint tools the suites drive
        run: python scripts/ci/install_lint_tools.py

      # `javascript` names the shipped JavaScript the floor was measured
      # on, and `javascript-all-files` keeps a file no test loads in it at
      # 0 hits. `-p no:cacheprovider`: pytest processes sharing one rootdir
      # race on `.pytest_cache`'s staging directory, which aborts a
      # sibling's collection on Windows.
      - name: Run the shard's suites
        uses: Nitjsefnie-Actions/test-ratchet/run@916a819580fdb4133805bd7e4f46608849f05c7f  # v2.4.0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py${{ matrix.python }}
          shard: ${{ matrix.shard }}
          javascript: extension/**/*.js,dashboard/**/*.js
          javascript-code-only: 'true'
          javascript-any-character: 'true'
          javascript-all-files: 'true'
          args: -p no:cacheprovider

      # The gate is the answer to the cache-poisoning findings: an untrusted
      # event never writes cross-run state, and a push of main is the one
      # trigger whose checkout this repository produced. The save's position
      # does not change WHAT the cache holds, only who writes one: a run
      # cancelled during the suites never reaches this step.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}

  wheel:
    # Proves the published artifacts, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel whose commands do not exist, or a
    # tarball whose file list is whatever setuptools inferred. twine renders
    # the metadata of both formats before either of them is installed.
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Build the wheel and the sdist
        run: |
          # Both tools are pinned in requirements-release.txt, which
          # Dependabot's pip entry watches; see that manifest.
          pip install -r requirements-release.txt
          python -m build

      - name: Check both artifacts render
        run: python -m twine check --strict dist/*

      - name: Install it with no checkout in reach and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/daedalus" --version

      - name: Install the sdist, no checkout in reach, and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe-sdist"
          "$RUNNER_TEMP/probe-sdist/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe-sdist/bin/daedalus" --version

      # Uploaded only when a smoke test above did NOT pass. This job exists to
      # prove both published formats install and expose their entry point, and
      # it has proved that once the steps before this one succeed; keeping the
      # artifacts after that would retain a distributable wheel and sdist per
      # push, per pull request and per manual run, 90 days each.
      # Durable copies belong to releases, which release.yml publishes with
      # checksums.
      #
      # An artifact whose smoke test failed is the one worth having: it is the
      # copy you need to reproduce the failure, and it is rare.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ failure() }}
        with:
          name: artifacts-failed-smoke-test
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  # Runs after every test job, also when one failed, and is skipped with
  # them. Its job token comments on a pull request; it checks out the tree
  # only for the floors and runs nothing from it.
  report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The branch policy refuses other refs; an empty name binds no
    # environment, so pull requests can still run these checks.
    environment: ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/main' && 'main-push' || '' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Nitjsefnie-Actions/test-ratchet/report@916a819580fdb4133805bd7e4f46608849f05c7f  # v2.4.0
        with:
          github-token: ${{ github.token }}
          cell: ubuntu-latest-py3.15
          times: .github/test-times.json
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}

  # The ratchets test-ratchet does not cover, read off the gated cell's
  # JavaScript reports: the per-module uncovered-line counts, and on a push
  # of main the long-line and per-module baselines following a file down.
  ratchets:
    needs: test
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The branch policy refuses other refs; an empty name binds no
    # environment, so pull requests can still run these checks.
    environment: ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/main' && 'main-push' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Resolve threshold base
        env:
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DAEDALUS_EVENT: ${{ github.event_name }}
          DAEDALUS_BEFORE: ${{ github.event.before }}
        run: python scripts/ci/threshold_base.py

      # actions/download-artifact v8.0.2
      - uses: >-
          actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: test-ratchet-ubuntu-latest-py3.15-*
          path: ${{ runner.temp }}/test-ratchet

      # Policy tests select this step by its exact name.
      - name: JavaScript per-module coverage gate
        # A total can clear its floor while one module rots, so every
        # tracked file carries its own count of uncovered code lines.
        env:
          DAEDALUS_REPORTS: ${{ runner.temp }}/test-ratchet
        run: python scripts/ci/js_module_coverage.py "$DAEDALUS_REPORTS"

      - name: Work out the tighten this run justifies
        # Only measurements from main may change its calibration.
        id: ratchet
        if: ${{ github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        env:
          DAEDALUS_REPORTS: ${{ runner.temp }}/test-ratchet
        run: |
          # The long-line and per-module coverage baselines follow a file
          # down when it shrinks, so the lines cannot come back for free.
          # Growth is never written here — that stays a decision a reviewer
          # sees. File sizes and the suite tree's line budget are the
          # size-ratchet action's records, in a workflow of their own.
          python scripts/ci/line_lengths.py --tighten \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/js_module_coverage.py --tighten \
            "$DAEDALUS_REPORTS" \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/thresholds.py --check \
            --thresholds .github/ci-thresholds.json
          paths='.github/ci-thresholds.json'
          if git diff --quiet -- $paths; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No file lost an over-limit line and no module lost an uncovered JavaScript line.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- $paths
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the tighten
        # A deploy key, not the built-in token: a commit pushed from here
        # has no green checks yet, so a ruleset requiring them refuses the
        # built-in token's push. GitHub Actions cannot be added as a bypass
        # actor either; a deploy key can, it is scoped to this one
        # repository rather than to an account, and revoking it is deleting
        # one key.
        if: ${{ !cancelled() && steps.ratchet.outputs.changed == 'true' }}
        env:
          DAEDALUS_MASTER_PUSH_DEPLOY_KEY: >-
            ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          DAEDALUS_REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/ratchet_push.py .github/ci-thresholds.json \
            'ci: update CI ratchets'

  # What seven real user journeys cost, counted in instructions rather than
  # in the wall clock a test function happened to take.
  #
  # It measures the TREE, not a verdict about it, so it names no `needs:` and
  # no `if:` — it runs on a documentation-only change, on a manual dispatch,
  # and on a tree whose correctness gates are red, because a number nobody
  # asked for is still a number worth having. It carries no `name:`: the job
  # id IS the check-run name, and a `name:` here would be the one that
  # renames it.
  journey-budget:
    runs-on: ubuntu-latest
    # Headroom over a measured run, not a figure derived from one. All
    # seven journeys finished this job in 9m06s (run 36968752929), and a
    # three-journey run took 5m13s, so seven journeys cost less than twice
    # what three cost and 60 is several times what the measured run needs —
    # room for a slower runner, which is what a ceiling is for.
    timeout-minutes: 60
    # The branch policy refuses other refs; an empty name binds no
    # environment, so pull requests can still run these checks.
    environment: ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/main' && 'main-push' || '' }}
    env:
      # How many rounds the measurement takes. One is the steady state:
      # these counts are deterministic, so a discarded warm-up round buys
      # nothing. A higher value exists to derive a tolerance from a spread,
      # once, and is not what every run should pay for — three is how each
      # baseline's tolerance is measured, on the per-journey number.
      DAEDALUS_JOURNEY_ROUNDS: "1"

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'

      # The MCP journey loads the real MCP front end, and the front end's own
      # dependencies are what a bare interpreter cannot import.
      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt --only-binary=:all: --no-binary=PyYAML
          python -m pip install -r requirements-dev.txt

      # perf is NOT installable here and must not be asked for again.
      # `perf_event_paranoid` is 4 on the hosted image, so `perf stat` is
      # refused without CAP_PERFMON, CAP_SYS_PTRACE or CAP_SYS_ADMIN — none
      # of which a hosted runner grants, and none of which apt can supply.
      # callgrind is userspace, so the same runner CAN count instructions
      # once valgrind is on it. That is the fallback this installs, and it
      # is why the counter is found by measurement below rather than named
      # here: a runner where the install silently failed must still report
      # what it found, not what this step intended.
      # Candidate version bumps rotate the resolved-set key automatically.
      # Apt's hash check ignores stale fallback debs; the candidate governs.
      - name: Settle apt and name the valgrind package set
        id: vgset
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=5
          uris=$(apt-get --print-uris -y --no-install-recommends install valgrind)
          printf '%s\n' "$uris" | awk '/^\047/ {print $2}' | sort > "${RUNNER_TEMP}/vg-manifest.txt"
          echo "key=vg-debs-$(sha256sum "${RUNNER_TEMP}/vg-manifest.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the valgrind packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/vg-debs
          key: ${{ steps.vgset.outputs.key }}
          restore-keys: vg-debs-

      - name: Install valgrind, which supplies the instruction counter
        run: |
          mkdir -p "${RUNNER_TEMP}/vg-debs"
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/vg-debs/*.deb)
          if ((${#debs[@]})); then
            sudo cp "${debs[@]}" /var/cache/apt/archives/
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=5 install -y --no-install-recommends valgrind
          while IFS= read -r name; do
            sudo cp -n "/var/cache/apt/archives/$name" "${RUNNER_TEMP}/vg-debs/"
          done < "${RUNNER_TEMP}/vg-manifest.txt"

      - name: Save the valgrind packages
        # Save before measurement can fail; failed installs must not cache fallback sets.
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ success() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: ${{ runner.temp }}/vg-debs
          key: ${{ steps.vgset.outputs.key }}

      # A valgrind client request is `asm volatile` inside a GNU statement
      # expression, so pure Python cannot issue one and the counted boundary
      # is a helper this job compiles from the committed source -- which is
      # why it is a file in the repository and not a heredoc here. The
      # source is committed beside the measurement's own tooling and is not
      # part of the package; nothing outside this job builds or loads it.
      #
      # The path is ABSOLUTE and goes out through `$GITHUB_ENV`, because every
      # `run:` is a fresh shell with its own working directory: a relative
      # name would resolve against whatever the measuring step's cwd is, and
      # the child this names reads the variable through the environment it
      # inherits rather than through anything on disk.
      - name: Build the counted-boundary helper
        run: |
          cc -shared -fPIC -O2 \
            -o "${RUNNER_TEMP}/callgrind_boundary.so" \
            scripts/ci/callgrind_boundary.c
          echo "DAEDALUS_CALLGRIND_BOUNDARY=${RUNNER_TEMP}/callgrind_boundary.so" >> "$GITHUB_ENV"

      # What this runner actually allows, decided by measurement, and asked
      # AFTER the install above so the answer is about this runner as it will
      # measure. A counter it reports as unavailable is a counter the check
      # refuses to compare, not one it reads as "nothing over budget".
      # `--summary` writes that block ONLY where no counter is usable, so a
      # healthy runner prints an empty summary here by design.
      - name: Probe the counters
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/ci/journey_budget.py probe --summary

      # The rounds are the job's `DAEDALUS_JOURNEY_ROUNDS`, and the committed
      # default is one: these counts are deterministic, so a discarded
      # warm-up round
      # buys nothing. More than one round is for deriving the tolerance from
      # a spread, once.
      - name: Measure the journeys
        id: measure
        # Step-level, because the step that reads the value is the step
        # that sets it: `journey_thread_rows.enabled()` is consulted by this
        # step's own process, after valgrind has exited, and no counted
        # child consults it — so the variable is inert to every child
        # whichever level it is set at, and this is where its scope sits
        # beside the step that uses it. The flag records each counted
        # thread's own total beside the sum, so a run whose counts moved can
        # say which thread moved them; the function flag is the same deal
        # one level deeper, which function inside a kept thread it was.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DAEDALUS_JOURNEY_THREAD_ROWS: "1"
          DAEDALUS_JOURNEY_FUNCTION_ROWS: "1"
          DAEDALUS_COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py measure --root . \
            --rounds "${DAEDALUS_JOURNEY_ROUNDS:-1}" --out "$DAEDALUS_COUNTS"

      # A re-baseline raises a recorded count, so it stays a reviewed commit.
      # What the refusal below prints is one command over THIS run's own
      # measurement, which is what travels with the run: a pasted block is a
      # reader copying numbers out of a table, and the copy is what goes
      # wrong.
      - name: Upload the measured counts
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: journey-counts
          path: ${{ runner.temp }}/journey-counts.json
          if-no-files-found: error

      # The one verdict: over budget is a regression, and nothing below this
      # step runs when it is one.
      - name: Check the journeys against the budget
        id: check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DAEDALUS_COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py check --root . \
            --measurements "$DAEDALUS_COUNTS" --summary

      # The budget must follow a journey down on its own, or it sits at old
      # high counts until somebody remembers to lower them and a later
      # regression up to those counts passes. Down only: a run with a rise
      # writes nothing, and the check above must have concluded success, so
      # the run that found a regression writes nothing.
      #
      # A run where NO COUNT WAS COMPARED writes nothing too, and succeeds:
      # a recorded gate that moved — most often the runner image — means no
      # journey was checked, not that one regressed. Both say so in the step
      # summary, so a green run with no commit is that case rather than a
      # green that recorded something. Re-recording is `rebaseline`.
      - name: Follow the journeys that got cheaper
        id: tighten
        if: ${{ !cancelled() && steps.check.conclusion == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DAEDALUS_COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py check --root . \
            --measurements "$DAEDALUS_COUNTS" --tighten
          if git diff --quiet -- .github/journey-budget.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One script, both jobs. `scripts/ci/ratchet_push.py` holds the deploy
      # key, the pinned host key and the discrimination between a refused
      # push and a concurrent one, so a second copy of a write credential
      # cannot exist here to drift from the ratchets job's.
      - name: Commit the tighten
        if: ${{ !cancelled() && steps.tighten.outputs.changed == 'true' }}
        env:
          DAEDALUS_MASTER_PUSH_DEPLOY_KEY: >-
            ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          DAEDALUS_REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/ratchet_push.py .github/journey-budget.json \
            'ci: tighten the journey budget'

  size-baseline:
    # The size-ratchet action's install block, called. A called run reads
    # an environment secret as empty, so the file's own default-branch
    # push run is the one that commits tightened records. zizmor's `$/`
    # form is refused by the pinned actionlint, which accepts only `./`.
    uses: ./.github/workflows/size-baseline.yml  # zizmor: ignore[self-repository]

  # audit.yml's threshold direction guard, run here so `Aggregate workflow
  # checks` requires it on each pull request into main; audit.yml still runs
  # it on the threshold-only pushes this workflow ignores. A superseded head's
  # cancel loses nothing: the guard judges the whole merge-base..head range.
  thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the threshold document
        run: python3 scripts/ci/thresholds.py --check

      - name: Resolve threshold base
        env:
          DAEDALUS_REPO: ${{ github.repository }}
          DAEDALUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DAEDALUS_EVENT: ${{ github.event_name }}
          DAEDALUS_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/threshold_base.py

      - name: Threshold direction guard
        run: |
          base="${DAEDALUS_THRESHOLDS_BASE_REV:?Threshold base missing}"
          echo "Threshold direction: base=$base head=$(git rev-parse HEAD)"
          git show "${base}:.github/ci-thresholds.json" > "$RUNNER_TEMP/base-thresholds.json"
          python3 scripts/ci/thresholds_guard.py \
            --base "$RUNNER_TEMP/base-thresholds.json" \
            --head .github/ci-thresholds.json --base-rev "$base" --head-rev HEAD

  aggregate:
    name: Aggregate workflow checks
    if: ${{ always() }}
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
      - plan
      - test
      - wheel
      - report
      - ratchets
      - journey-budget
      - size-baseline
      - thresholds
    runs-on: ubuntu-latest
    # Two numbers, and the gap between them is the reason for both. The
    # poll bound (DAEDALUS_SECRETS_POLL_BOUND_S below) IS the gitleaks job's
    # own 10-minute backstop: no queueing is left in it, so a scan unreported
    # by then is refused rather than waited on.
    #
    # A superseded cancellation makes two reads before the scan wait,
    # without reading its own jobs. The deadline-straddling poll and the
    # scan's jobs read add two read ceilings after the wait. Ten minutes
    # plus four two-minute read ceilings reserves 18 of these 20;
    # poll-sleep overshoot and reporting use the remaining allowance.
    # A non-superseded cancellation makes three reads and returns red,
    # without polling for the secrets scan.
    timeout-minutes: 20
    # A job-level block replaces the workflow-level one rather than adding
    # to it: contents read pays for the checkout, actions read is what lets
    # GITHUB_TOKEN list workflow runs for the supersession check and the
    # secrets verdict.
    permissions:
      contents: read  # the checkout
      actions: read  # the workflow-run reads

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check no tracked file carries a merge-conflict marker
        # A conflict marker is text that looks like prose in a Markdown file,
        # so only a mechanical check can see it. git grep reads the tracked
        # files out of the working tree, which on a clean checkout is what the
        # repository ships, and -I keeps a binary from being reported as a
        # match. The three markers are matched in the shapes git writes them:
        # `<<<<<<< ` and `>>>>>>> ` carry the label after seven characters, and
        # the separator is exactly seven `=`; diff3's extra `||||||| base` line
        # changes nothing, because the other three are still written.
        # In this job, not a new one: a new job is a new required status
        # context (a ruleset edit), and `Aggregate workflow checks` reports on
        # each pull request into main whatever the docs-only classifier says
        # (`if: always()`) — doc-only commits are where a marker lands. Ahead
        # of the verdict step so a marker never waits out its poll bound.
        # Explicit `shell: bash`: the explicit form adds --noprofile --norc,
        # and pipefail is its only operative delta — the body already guards
        # `git grep` with `|| found=$?`, so no pipe here can turn "no match"
        # into a failure the implicit shell would not have.
        shell: bash
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      # scripts/ci/aggregate_gate.py owns the verdict, including the
      # superseded-cancel rule: a cancelled dependency whose run a strictly
      # newer run of this workflow replaced gates nothing, while a
      # deliberate cancel stays a failure.
      #
      # It also requires the `secrets` workflow's gitleaks job on this head
      # SHA. That job is in no `needs:` set and no required context of this
      # repository, so `needs:` cannot reach it and a pull request whose
      # scan is red would otherwise merge green.
      #
      # No event skips it, workflow_dispatch included: a dispatch publishes
      # its check run on the SHA it ran against, and GitHub reads required
      # contexts off the check runs on the pull request head whatever event
      # produced them — a skip here would be a bypass. The cost is that a
      # manual run at a SHA with no `secrets` run goes red once the bound
      # expires, which is what
      # `gh workflow run secrets.yml --ref <branch>` is for.
      - name: Check dependency results
        env:
          GH_TOKEN: ${{ github.token }}
          DAEDALUS_NEEDS_JSON: ${{ toJSON(needs) }}
          DAEDALUS_REPOSITORY: ${{ github.repository }}
          DAEDALUS_RUN_ID: ${{ github.run_id }}
          DAEDALUS_HEAD_BRANCH: >-
            ${{ github.event.pull_request.head.ref || github.ref_name }}
          DAEDALUS_SECRETS_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          DAEDALUS_SECRETS_POLL_BOUND_S: '600'
        run: python3 scripts/ci/aggregate_gate.py
