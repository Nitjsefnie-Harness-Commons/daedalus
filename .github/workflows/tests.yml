name: tests

# A matrix, because the suites start the real bridge and talk to it over
# loopback: socket behaviour, path spelling, temp-dir aliasing (macOS resolves
# /var to /private/var) and process teardown all differ per platform, and all
# four are load-bearing here.
#
# The bridge and the CLI are stdlib-only on purpose. The MCP server is the one
# part with dependencies, so the matrix installs the package and its mcp extra
# rather than letting that suite skip.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Read-only: without an explicit block a job inherits the
# repository default, which can be write for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      # Without these the MCP suite skips, and a run where every MCP test
      # skipped is indistinguishable from one where they passed.
      - name: Install the MCP server's dependencies
        run: python -m pip install --upgrade pip . ".[mcp]"

      - name: Run every suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

  wheel:
    # Proves the published artifact, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel whose commands do not exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it with no checkout in reach and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/daedalus" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheel
          path: dist/*.whl
