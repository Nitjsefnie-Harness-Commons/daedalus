name: tests

# A matrix, because the suites start the real bridge and talk to it over
# loopback: socket behaviour, path spelling, temp-dir aliasing (macOS resolves
# /var to /private/var) and process teardown all differ per platform, and all
# four are load-bearing here.
#
# The bridge and the CLI are stdlib-only on purpose. The MCP server is the one
# part with dependencies, so the matrix installs the package and its mcp extra
# rather than letting that suite skip.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Read-only: without an explicit block a job inherits the
# repository default, which can be write for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every stable minor requires-python admits. 3.14 was accepted by
        # the metadata and executed nowhere, so the oldest and the newest
        # supported interpreter were both claims rather than results.
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Without these the MCP suite skips, and a run where every MCP test
      # skipped is indistinguishable from one where they passed.
      - name: Install the MCP server's dependencies
        run: python -m pip install --upgrade pip . ".[mcp]"

      - name: Run every suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

  wheel:
    # Proves the published artifact, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel whose commands do not exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it with no checkout in reach and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/daedalus" --version

      # Uploaded only when the smoke test above did NOT pass. This job exists
      # to prove the wheel imports and exposes its entry point, and it proved
      # that the moment the step before this one succeeded — keeping the
      # artifact after that retained a distributable wheel per push, per pull
      # request and per manual run, 90 days each. Durable wheels belong to
      # releases, which release.yml publishes with checksums.
      #
      # A wheel whose smoke test failed is the one worth having: it is the
      # artifact you need to reproduce the failure, and it is rare.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ failure() }}
        with:
          name: wheel-failed-smoke-test
          path: dist/*.whl
          retention-days: 14

  coverage:
    # A JOB of its own, not steps inside the matrix above: the matrix is
    # 3 OSes x 3 Pythons, and coverage of the same code nine times over
    # tells you the same number nine times. One run, on the newest Python
    # and the cheapest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Absolute, because the runner's own tests copy run_tests.py into a temp
      # tree and run it with that tree as the working directory. A relative
      # data file follows the child's cwd, so its measurements were written
      # inside the tree and deleted with it.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install the coverage toolchain and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          # The mcp extra too: without it the MCP suite skips itself entirely
          # and mcp_server.py contributes a zero to a number that is supposed
          # to describe the code this repository ships.
          python -m pip install . ".[mcp]"

      - name: Measure the bridge's child processes too
        # Nearly every suite runs server.py as a CHILD, so a plain coverage run
        # measures the test process and reports a fraction of what the bridge
        # actually executes -- 13.9% against the 89.7% the same suites really
        # reach. Coverage only joins a subprocess when process_startup() runs
        # at interpreter start, which is what this .pth does.
        run: |
          site="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          echo 'import coverage; coverage.process_startup()' \
            > "$site/coverage-subprocess.pth"
          cat "$site/coverage-subprocess.pth"

      - name: Measure
        id: measure
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        # Each suite in its OWN subprocess with --parallel-mode, then
        # combined -- because that is exactly what run_tests.py does, and
        # measuring a different execution shape than CI actually runs would
        # report coverage for a program nobody executes. A failing suite
        # does not fail this job: the matrix above owns that verdict, and the
        # gate below is about how much code was reached.
        run: |
          shopt -s nullglob
          suites=(tests/test_*.py)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "no suites found — refusing to report 0% as a pass" >&2
            exit 1
          fi
          failed=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            if ! python -m coverage run --parallel-mode "$suite"; then
              echo "  (suite did not pass; its coverage still counts)"
              failed=$(( failed + 1 ))
            fi
            echo "::endgroup::"
          done

          # A FAILING suite is fine here — the matrix owns that verdict, and a
          # test that fails still executed the lines it reached. Every suite
          # failing is a different thing: it means nothing ran, and the number
          # below would describe no program at all. That is not a low coverage
          # result to gate on, it is a broken job.
          if [ "$failed" -eq "${#suites[@]}" ]; then
            echo "every one of the ${#suites[@]} suites failed — refusing to" >&2
            echo "report a coverage number for a program that did not run." >&2
            exit 1
          fi

          python -m coverage combine

      - name: Coverage summary
        # Renders whether or not the gate below passes — a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines, and re-reading a scrolled CI log to find that is exactly
        # the friction that gets a gate disabled.
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### Coverage'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # A RATCHET, not a target. The floor sits just under what this job
        # actually measures, so ordinary churn stays green and a real
        # regression goes red. Raise it by hand as coverage climbs — never
        # lower it to make a red build green.
        #
        # The two numbers below are checked against each other and against the
        # flag by test_the_coverage_ratchet_records_what_it_was_calibrated_to.
        # The buffer absorbs measurement variation — which suites reach a
        # subprocess before it exits, and which optional dependency set the
        # runner resolved — not a licence to regress into it.
        # measured: 73.3
        # floor: 72
        run: python -m coverage report --fail-under=72 --precision=1
