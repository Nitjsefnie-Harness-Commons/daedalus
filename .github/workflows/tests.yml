name: tests

# A matrix, because the suites start the real bridge and talk to it over
# loopback: socket behaviour, path spelling, temp-dir aliasing (macOS resolves
# /var to /private/var) and process teardown all differ per platform, and all
# four are load-bearing here.
#
# The bridge and the CLI are stdlib-only on purpose. The MCP server is the one
# part with dependencies, so the matrix installs the package and its mcp extra
# rather than letting that suite skip.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA, and a branch with no pull
    # request open is not a tree anyone is reviewing.
    branches: [main]
    # Ratchet commits change only this data; audit still gates those pushes.
    # The journey budget's counts join them: a tighten commit changes one
    # JSON file, and the ratchet that wrote it already ran.
    paths-ignore:
      - '.github/ci-thresholds.json'
      - '.github/journey-budget.json'
    # release.yml needs a run on the tagged SHA; audit remains unfiltered.
    #
    # Documentation-only runs are narrowed inside the workflow instead, by
    # the classifier's docs_only output: one suite leg runs, coverage skips,
    # and the required checks still report.
  # `pull_request`, never `pull_request_target`: the journey-budget job
  # checks out and RUNS the proposed code, and pull_request_target would run
  # it with a writable token and the base repository's secrets in reach.
  pull_request:
  workflow_dispatch:

# Read-only: without an explicit block a job inherits the
# repository default, which can be write for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only runs pay for one suite leg and no coverage. The
  # triggers stay unfiltered so every required check still reports; this
  # job reads the changed paths and emits the suites matrix and a
  # docs_only flag instead, and every fallback over-runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one rather than adding
    # to it: the pulls/<n>/files read needs pull-requests, nothing more.
    # The trailing notes are load-bearing, not decoration: without them
    # this `contents: read` line is byte-identical to diff-coverage's, and
    # the permission-mutation tests in tests/test_ci_workflows.py anchor
    # on the first occurrence in the file.
    permissions:
      contents: read  # the checkout and the push compare read
      pull-requests: read  # the pulls/<n>/files read
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      workflows: ${{ steps.classify.outputs.workflows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci/classify_changes.py

  # Two gates, one job each so a failure says which tool found it.
  #
  # Style opinions stay off (max-line-length = 10000 in setup.cfg, and
  # .pylintrc disables the formatting and metric checks): these exist for
  # real defects, not formatting preferences. Every disable in .pylintrc
  # names the pattern it is there for.
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      # The pip cache is restored on every event and saved only from a push
      # of main, as in the matrix and coverage jobs — `cache: pip` saves in
      # a post-job step running after the pull-request checkout, the
      # poisoning shape those jobs dropped (issues #166, #185). The key
      # shares the matrix jobs' 3.13 namespace: the cache holds fetched
      # packages, so what one job warmed any of them reuses.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle

      # Only a push of main writes cross-run state, and a cancelled run
      # never reaches this step; nothing between the install and here runs
      # pip, so the position after the lint run decides who writes a cache,
      # never what it holds.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      # The pip cache is restored on every event and saved only from a push
      # of main, as in the matrix and coverage jobs — `cache: pip` saves in
      # a post-job step running after the pull-request checkout, the
      # poisoning shape those jobs dropped (issues #166, #185). The key
      # shares the matrix jobs' 3.13 namespace: the cache holds fetched
      # packages, so what one job warmed any of them reuses.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      # The MCP server's dependencies are installed for the same reason as in
      # the pyright job: pylint resolves imports, so without them every httpx,
      # mcp, starlette and uvicorn line in daedalus_mcp/server.py (and httpx in
      # scripts/mcp_probe.py) reports as import-error instead of being checked.
      # diff_coverage.py likewise imports the pinned statement analyzer.
      - name: Install linters and import dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt
          pip install ".[mcp]"

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc

      # Only a push of main writes cross-run state, and a cancelled run
      # never reaches this step; nothing between the install and here runs
      # pip, so the position after the lint run decides who writes a cache,
      # never what it holds.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}

  # pyright runs over two scopes. This job checks the bridge, the CLI and the
  # scripts under pyrightconfig.json, which excludes the suites: they load
  # their target by path and reach into module internals on purpose, which a
  # type checker can only ever call an error. A second scope,
  # pyrightconfig.tests.json, checks the suites themselves, and the type error
  # ratchet below is what keeps that scope measured. A file belongs to exactly
  # one: a suite in the second, everything else in the first.
  #
  # pythonPlatform is "All" rather than the runner's: the bridge branches on
  # platform at runtime, and those branches should be checked wherever this
  # runs.
  #
  # The `mcp` extra is installed for one reason: daedalus_mcp/server.py imports
  # httpx, starlette and the MCP SDK, and without them every line that touches
  # them reads as an unresolved import rather than as code anyone checked.
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      # The pip cache is restored on every event and saved only from a push
      # of main, as in the matrix and coverage jobs — `cache: pip` saves in
      # a post-job step running after the pull-request checkout, the
      # poisoning shape those jobs dropped (issues #166, #185). The key
      # shares the matrix jobs' 3.13 namespace: the cache holds fetched
      # packages, so what one job warmed any of them reuses.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install the type checker and the dependencies it resolves
        # scripts/ci is in the checker's scope, and two of its modules import
        # coverage, so the measurement pins belong here as well as in the
        # matrix that runs them. An unresolved import is a type error.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt
          pip install ".[mcp]"

      - name: pyright
        run: pyright

      - name: type error ratchet
        run: python3 scripts/ci/type_error_baseline.py

      # Only a push of main writes cross-run state, and a cancelled run
      # never reaches this step; nothing between the install and here runs
      # pip, so the position after the lint run decides who writes a cache,
      # never what it holds.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}

  # The JavaScript half of the tree had no static analysis at all:
  # pycodestyle and pylint run over *.py and pyright checks types, while the
  # extension service worker, the page relay and the dashboard modules were
  # checked only where a bespoke test happened to model them.
  #
  # The value here is no-undef and no-unused-vars — a typo'd identifier in
  # the service worker should be found by CI rather than by a user whose
  # browser silently stopped relaying. Stylistic rules stay off, consistent
  # with the Python gate, which turns its formatting checks off for the same
  # reason.
  #
  # There is deliberately NO package.json: the versions are pinned right here
  # and installed with --no-save, so the repository does not read as having
  # adopted a build step it does not have. The job also checks every pin
  # against its own registry: an out-of-date major fails the job, so no pin
  # can silently rot the way an unnoticed eslint@8 did.
  #
  # examples/ is NOT linted, and that is a real gap rather than an oversight.
  # Those files are snippets the bridge wraps in an async function before
  # running, so they carry top-level `return` AND top-level `await` together.
  # No espree sourceType describes that shape: `script` rejects the await,
  # `module` rejects the return. They are excluded in eslint.config.js so a
  # local run agrees with this one, and the file list below excludes them too
  # so the run is silent rather than six ignore warnings deep.
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # One copy of each pin, read by the install step and by the currency
      # check, so the installed version and the checked version cannot
      # diverge. @eslint/js carries the recommended rules and globals the
      # browser/serviceworker environments; eslint itself depends on neither.
      ESLINT_VERSION: "10.9.1"
      ESLINT_JS_VERSION: "10.0.1"
      GLOBALS_VERSION: "17.12.0"

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config is reusable
          # by every later step in the job.
          persist-credentials: false

      # actions/setup-node v7.0.0
      - uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install eslint (pinned, no package.json, no build step)
        # zizmor: ignore[adhoc-packages]
        # The finding is "installs packages outside of a lockfile", and the
        # absence of a lockfile is the deliberate design documented above: a
        # package.json here would read as this repository having adopted a
        # build step, which it has not. Every package in this command is
        # pinned to an exact version; what stays unpinned is their transitive
        # graph, and that residual drift is accepted -- the currency check
        # below exists because the top-level pin itself is what rots.
        run: >-
          npm install --no-save --no-package-lock --no-audit --no-fund
          "eslint@${ESLINT_VERSION}"
          "@eslint/js@${ESLINT_JS_VERSION}"
          "globals@${GLOBALS_VERSION}"

      # Three pins ride one install command, so one of them rotting is
      # enough to break the job: each is compared here with its own
      # registry's latest stable major, a pin that has drifted away fails
      # the job instead of passing an error it swallowed, and a query that
      # cannot answer fails the job rather than passing a pin it never
      # saw. Compare majors, not patch versions: staying current within a
      # major is npm's business between runs, while a new major is the
      # maintainer's call.
      - name: Check the pins against the registries' latest majors
        run: |
          stale=0
          drift=0
          for pin in \
            "ESLINT_VERSION:eslint" \
            "ESLINT_JS_VERSION:@eslint/js" \
            "GLOBALS_VERSION:globals"
          do
            var="${pin%%:*}"
            package="${pin#*:}"
            pinned="${!var}"
            # A renamed or deleted env pin resolves empty, and an empty pin
            # makes the -gt comparison error inside its own if, which reads
            # as "not stale". Fail instead, naming the variable.
            if [ -z "${pinned}" ]; then
              echo "${var} is unset or empty, so ${package} has no pin" \
                "to check." >&2
              drift=1
              continue
            fi
            latest="$(npm view "${package}" version)"
            pinned_major="${pinned%%.*}"
            latest_major="${latest%%.*}"
            echo "pinned ${package}@${pinned}; registry latest ${latest}"
            if [ "${latest_major}" -gt "${pinned_major}" ]; then
              echo "${package} ${latest} is out," \
                "and the pin ${var}=${pinned} is a major behind it." >&2
              stale=1
            fi
          done
          if [ "${drift}" -ne 0 ]; then
            echo "Restore the named env pins so every installed package" >&2
            echo "has a pin this job checks." >&2
            exit 1
          fi
          if [ "${stale}" -ne 0 ]; then
            echo "Raise the named env pins, and eslint.config.js with" >&2
            echo "them if the new majors need config changes, then re-run" >&2
            echo "this job." >&2
            exit 1
          fi

      - name: eslint
        # git ls-files, so the list is the tracked tree rather than a glob
        # someone has to remember to widen. The pathspec excludes examples/
        # for the reason above, and the emptiness check keeps a list that
        # matched nothing from reading as a clean lint.
        run: |
          mapfile -t sources < <(git ls-files '*.js' ':!:examples/*')
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "no JavaScript matched; refusing to report a clean lint" >&2
            exit 1
          fi
          printf 'linting %d files\n' "${#sources[@]}"
          npx --no-install eslint "${sources[@]}"

  # The gate on the gates. Everything else in .github/workflows is unreviewed
  # code that runs with a repository token, and a mistake in it fails in ways
  # the other gates structurally cannot catch: a workflow with a typo in an
  # `if:` expression does not go red, it silently stops running.
  #
  # Two tools, because they answer different questions:
  #
  #   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
  #   context availability (`github.event.review` on a push event), `runs-on`
  #   labels, and shellcheck over every `run:` block, which is where most real
  #   bugs live.
  #
  #   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
  #   `run:` block, over-broad `permissions:`, credential persistence after
  #   checkout, unpinned action references.
  #
  # Both tools are pinned, and actionlint is verified by checksum rather than
  # trusted from the release page: a linter that runs before every other gate
  # is a supply-chain position worth defending.
  #
  # The checksum below is recorded HERE rather than read from the release's own
  # checksums file, which is the property that matters: it is a value this
  # repository decides and anyone reviewing this line can check, rather than a
  # value republished by whoever published the binary. The actionlint build
  # comes from a fork of ours, so the checksum file beside the asset is written
  # by the same party as the asset. Upstream's release is not immutable either,
  # so the delta is who holds write access, not whether the tag can move.
  #
  # A suppression belongs at the offending line as a `# zizmor: ignore[rule]`
  # comment with a justification, never as a raised threshold here — a
  # threshold silences the next finding too, and the next one is the one
  # nobody has thought about yet.
  actionlint:
    needs: changes
    if: ${{ github.event_name == 'push'
            || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # A fork build, not an upstream release. v1.7.12 is the latest upstream
      # tag and it rejects `queue` under `concurrency`, a key GitHub documents,
      # so the key cannot be expressed in a workflow here. 1.7.12-queue.1 is
      # the v1.7.12 TAG plus rhysd/actionlint#654 cherry-picked unchanged, so
      # the source delta from upstream v1.7.12 is exactly that patch. The
      # binaries are not byte-identical to upstream's asset: this one is built
      # with go1.26.4 and upstream's v1.7.12 with go1.26.1.
      #
      # When #654 merges and ships upstream, move this back to an upstream
      # version string, the rhysd release URL below, and the checksum above
      # with them. The fork lags upstream by the ten commits merged after the
      # v1.7.12 tag, two of which are behavioural (service-container
      # `entrypoint`/`command`, and a darwin shellcheck deadlock fix), so
      # returning to upstream is a pin change and no merge.
      ACTIONLINT_VERSION: 1.7.12-queue.1
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz, from the
      # release's own checksums file. Bump both together.
      ACTIONLINT_SHA256: >-
        dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the install
        # script: piping a fetch into a shell would make this job trust
        # whatever that URL serves at run time. The transfer is bounded so a
        # hung mirror fails the step instead of holding the runner.
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url='https://github.com/Nitjsefnie-OSC/actionlint/releases/download'
          url="${url}/v${ACTIONLINT_VERSION}/${tarball}"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            -o "$tarball" "$url"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          python -m pip install --upgrade pip
          pip install zizmor==1.29.0

      - name: actionlint
        id: actionlint
        # Both extensions GitHub accepts, not just .yml. Pushes always run this
        # job; on other events the classifier runs it for every file under
        # .github/workflows and zizmor scans the whole directory, so a
        # workflow named .yaml must not start this gate and then be skipped by
        # it. nullglob keeps an extension nothing
        # matches from arriving as a literal pattern, and the emptiness check
        # keeps a directory with no workflows from reading as a clean lint —
        # which would move the silent pass rather than remove it.
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#workflows[@]} -eq 0 ]; then
            echo "no workflow files matched; refusing to report a clean lint" \
              >&2
            exit 1
          fi
          ./actionlint -color "${workflows[@]}"

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates —
        # the same shape the pylint and pycodestyle jobs use. Not when the
        # install itself failed, which would report a tool bug as a clean
        # audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/

      - name: Verify the actions/cache release annotations upstream
        # zizmor's impostor-commit audit proves a pinned SHA belongs to the
        # action's repository; only this proves it is the release the
        # comment beside it names. Runs when actionlint is red too, so one
        # push reports every gate this job holds.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cache_action_releases.py

  suites:
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      # The os/python lists live in FULL_MATRIX in
      # scripts/ci/classify_changes.py, which the changes job renders:
      # one leg for a documentation-only run, all twelve otherwise.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false
          # The branch-boundary controls in tests/test_reserved_test_names.py
          # read the MERGE BASE's own definitions, and a depth-1 checkout
          # resolves neither origin/main nor a local main, so both boundary
          # tests refuse there and the property every allowance row rests
          # on is never evaluated. tests/test_workflow_job_timeouts.py pins
          # this.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The suites this job runs skip on node, so it declares node rather
      # than inheriting whatever the hosted image happens to carry; a
      # job that reaches the suites and does not say so is the shape
      # test_ci_tool_declarations.py's declaration control refuses, and it reads
      # ORDER, so this step has to stay above the first suite-running one.
      # No package-manager cache: this job has no lockfile, and a cache
      # written here is cross-run state no gate on this event reaches.
      # actions/setup-node v7.0.0
      - uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      # The pip cache is restored on every event and saved only from a push of
      # main. Restore and save are separate steps so the event gate can sit
      # between them: `cache: pip` saves in a post-job step that runs after the
      # job has checked out and executed the code under test, so a pull-request
      # run could write what a later main run restores — the shape issue #166
      # recorded.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-

      # Without the MCP extra that suite skips; test_diff_coverage imports the
      # statement analyzer pinned in requirements-test.txt. requirements-dev.txt
      # is here for test_type_errors, which drives the real pyright binary. A
      # job that runs every suite needs the toolchain those suites invoke, and
      # a needs: relation sequences jobs without sharing an environment between
      # them, so this file has to be installed here too, not only by the lint
      # jobs.
      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-dev.txt

      # The suites drive real binaries, and a suite that finds one missing
      # SKIPS — on every leg, silently, so a job can be green having verified
      # nothing. This is the step that turns those skips into runs. It runs
      # after the install above so both tools are first on PATH: this step
      # installs each of them itself, at the pins that install names, so
      # what the suites find is what this step put there rather than what
      # the job happened to bring or what the runner image happened to ship.
      - name: Install the lint tools the suites drive
        run: python scripts/ci/install_lint_tools.py

      - name: Run every suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

      # The gate is the answer to the cache-poisoning findings: an untrusted
      # event never writes cross-run state, and a push of main is the one
      # trigger whose checkout this repository produced. The save's position
      # does not change WHAT the cache holds, only who writes one: a run
      # cancelled during the suites never reaches this step. The installer
      # above runs pip, so the comment this replaced — that nothing between
      # the install and here runs pip — is no longer true, and the claim now
      # made in its place is the one that matters: that pip call installs
      # the same wheel this job's own install already put in the restored
      # key, so the save publishes nothing the restore did not already hold.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}

  wheel:
    # Proves the published artifacts, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel whose commands do not exist, or a
    # tarball whose file list is whatever setuptools inferred. twine renders
    # the metadata of both formats before either of them is installed.
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel and the sdist
        run: |
          # twine is pinned exactly here: the metadata gate may not float.
          python -m pip install --upgrade pip build twine==7.0.0
          python -m build

      - name: Check both artifacts render
        run: python -m twine check --strict dist/*

      - name: Install it with no checkout in reach and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/daedalus" --version

      - name: Install the sdist, no checkout in reach, and run its entry point
        run: |
          python -m venv "$RUNNER_TEMP/probe-sdist"
          "$RUNNER_TEMP/probe-sdist/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe-sdist/bin/daedalus" --version

      # Uploaded only when a smoke test above did NOT pass. This job exists to
      # prove both published formats install and expose their entry point, and
      # it proved that the moment the steps before this one succeeded —
      # keeping the artifacts after that retained a distributable wheel and
      # sdist per push, per pull request and per manual run, 90 days each.
      # Durable copies belong to releases, which release.yml publishes with
      # checksums.
      #
      # An artifact whose smoke test failed is the one worth having: it is the
      # copy you need to reproduce the failure, and it is rare.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ failure() }}
        with:
          name: artifacts-failed-smoke-test
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  coverage-matrix:
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
    # Coverage data is collected on one supported runner per OS. The normal
    # suites matrix still owns the full Python-version test matrix; keeping
    # this job at one interpreter makes the artifact set a platform union,
    # not twelve copies of the same measurement.
    if: ${{ !cancelled() && !failure()
               && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    # A hang backstop, sized from the measurement rather than tuned to pass,
    # and this is the number a future reader will otherwise "correct".
    # On main this cell took 29.4, 23.9, 29.4 and 28.5 minutes over its last
    # four completed runs — 98% of a 30-minute budget before this change
    # existed. On this branch the windows-latest cell ran 23:53 to 00:23 and
    # was KILLED at 30 having reported no failed step, which is what
    # `timeout-minutes` produces and not what a failure produces. The cause
    # is that #1307's workflow-lint tests now RUN on Windows instead of
    # skipping there: this branch installs actionlint and shellcheck on
    # every door, so the suite spends real time linting twelve workflows on
    # a cell that previously skipped it. The budget grew because the job now
    # does more work, not because the work got slower.
    #
    # 45 leaves headroom over both observations without pretending to know
    # the true duration: the four main runs are all under 30, this branch's
    # exceeded it, and nothing here measures a completed run of the new
    # shape. A per-SUITE bound is a different mechanism and PR 1368 owns it.
    timeout-minutes: 45

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: "${{ github.workspace }}/.coverage"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # This job runs the suites too, so it needs the same merge base
          # the branch-boundary controls read; see the suites job.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Same reason and the same order as the suites job: the suites reached
      # here skip on node, so this job declares it instead of inheriting the
      # image, and a declaration below the first suite-running step is not
      # one. `package-manager-cache: false` keeps this job out of the set of
      # cache-writing jobs test_workflow_cache_boundary.py records, which is
      # what the suites job's step does too.
      # actions/setup-node v7.0.0
      - uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      # Same cache, same gate as the suites job: restore on every event, save
      # only from a push of main, and never through `cache: pip`, whose
      # post-job save runs after the code under test.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-

      # This job runs every suite too, so it needs the toolchain those suites
      # invoke: test_type_errors drives the real pyright binary. A needs:
      # relation sequences jobs without sharing an environment between them,
      # so the lint jobs installing this file do not put pyright here.
      # Same file, same pinned version, as those jobs install.
      - name: Install the coverage toolchain and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install . ".[mcp]"
          python -m pip install -r requirements-dev.txt

      # The suites drive real binaries, and a suite that finds one missing
      # SKIPS — on every leg, silently, so this job can publish a coverage
      # number that never measured the part that needed the binary. One of
      # the two tools it names arrives with the install above; the step runs
      # no pip itself, so the cache save below is unaffected by it.
      - name: Install the lint tools the suites drive
        run: python scripts/ci/install_lint_tools.py

      - name: Measure the bridge's child processes too
        # On Windows terminate() kills fixture children without a coverage
        # flush, so child-process lines may be undercounted. Cross-platform
        # flushing is follow-up work.
        run: >-
          python -c "from pathlib import Path; import sysconfig; Path(
          sysconfig.get_paths()['purelib'], 'coverage-subprocess.pth').write_text(
          'import coverage; coverage.process_startup()\n', encoding='ascii')"

      - name: Enable JavaScript coverage on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: >-
          echo "NODE_V8_COVERAGE=$GITHUB_WORKSPACE/.node-v8-coverage"
          >> "$GITHUB_ENV"

      - name: Measure
        id: measure
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: python scripts/ci/coverage_suites.py --require-all

      # Same gate as the suites job: a pull-request or workflow_dispatch run
      # restores a cache and never writes one. Nothing between the install
      # and here runs pip either, so the save sits after the measurement for
      # the same reason: a cancelled run reaches no save. The coverage job
      # places its save at the install and accepts that write instead.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-*.txt') }}

      - name: Upload Ubuntu coverage data
        if: ${{ !cancelled() && steps.measure.conclusion == 'success'
                && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}
          path: |
            .coverage.*
            .node-v8-coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Python coverage data
        if: ${{ !cancelled() && steps.measure.conclusion == 'success'
                && matrix.os != 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
      - coverage-matrix
    # Skipped on a documentation-only run: no coverage number can move, and
    # a skipped required check reports success rather than going missing.
    if: ${{ !cancelled() && !failure()
               && needs.changes.outputs.docs_only != 'true' }}
    # The matrix above measures one interpreter on every supported OS. This
    # job owns the single combined gate: a Python line is covered when any OS
    # executed it, while JavaScript remains the Ubuntu measurement because
    # V8 records embed runner-specific file URLs.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Absolute, because the runner's own tests copy run_tests.py into a temp
      # tree and run it with that tree as the working directory. A relative
      # data file follows the child's cwd, so its measurements were written
      # inside the tree and deleted with it.
      COVERAGE_FILE: "${{ github.workspace }}/.coverage"
      # Node children inherit NODE_V8_COVERAGE from this job environment,
      # so V8 writes here directly; no harness plumbing is needed.
      NODE_V8_COVERAGE: "${{ github.workspace }}/.node-v8-coverage"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The SHA the event named, not `refs/pull/N/merge` resolved now.
          # `diff-coverage` checks out the same value, so the report and the
          # diff describe one tree even if GitHub recomputes the merge ref
          # between the two jobs.
          ref: ${{ github.sha }}
          persist-credentials: false

      # No `cache: pip`. It saves in a post-job step, after the job has run
      # untrusted code, so the cache is two explicit steps instead: restore on
      # every event, save only from a push of main — the gate that answers the
      # cache-poisoning findings, as in the suites and coverage-matrix jobs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install the coverage toolchain and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          # The mcp extra too: without it the MCP suite skips itself entirely
          # and daedalus_mcp/server.py contributes a zero to a number that is supposed
          # to describe the code this repository ships.
          python -m pip install . ".[mcp]"

      # Immediately after the install, the last step that adds anything to
      # what the cache holds: no step below installs a package. Same gate as
      # the suites and coverage-matrix jobs, but placed before this job's
      # work rather than after it — so a run cancelled later still leaves a
      # cache written here, which their placement avoids.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-*.txt') }}

      - name: Download per-OS coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: false

      - name: Combine per-OS coverage data
        id: measure
        run: |
          python scripts/ci/coverage_combine.py coverage-data/coverage-data-*
          mkdir -p "$NODE_V8_COVERAGE"
          find coverage-data/coverage-data-ubuntu-latest/.node-v8-coverage \
            -type f -name 'coverage-*.json' \
            -exec cp {} "$NODE_V8_COVERAGE" \;

      - name: Python coverage summary
        # Renders whether or not the gate below passes — a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines, and re-reading a scrolled CI log to find that is exactly
        # the friction that gets a gate disabled.
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### Python coverage'
            echo
            printf '%s %s\n' \
              'Python statement coverage and JavaScript physical code-line' \
              'coverage are separate metrics; do not add them together.'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: JavaScript coverage summary
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### JavaScript coverage'
            echo
            python scripts/ci/js_coverage.py "$NODE_V8_COVERAGE" \
              --xml javascript-coverage.xml
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: |
            coverage.xml
            javascript-coverage.xml
          if-no-files-found: error

      # Policy tests select this step by its exact name.
      - name: Python coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          python_floor="$(python scripts/ci/thresholds.py \
            --coverage-floor python)"
          python -m coverage report "--fail-under=$python_floor" --precision=1

      # Policy tests select this step by its exact name.
      - name: JavaScript coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # JavaScript floors use physical code-line coverage.
        run: |
          javascript_floor="$(python scripts/ci/thresholds.py \
            --coverage-floor javascript)"
          python scripts/ci/js_coverage.py "$NODE_V8_COVERAGE" \
            --xml javascript-coverage.xml \
            "--fail-under=$javascript_floor"

      # Policy tests select this step by its exact name.
      - name: JavaScript per-module coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # A total can clear its floor while one module rots, so every
        # tracked file carries its own count of uncovered code lines.
        run: |
          python scripts/ci/js_module_coverage.py "$NODE_V8_COVERAGE"

      - name: Work out the raise this run justifies
        # Only measurements from main may change its calibration.
        id: ratchet
        if: ${{ !cancelled() && steps.measure.conclusion == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        run: |
          python_measured="$(
            python -m coverage report --format=total --precision=1
          )"
          javascript_measured="$(
            python scripts/ci/js_coverage.py "$NODE_V8_COVERAGE" \
              --format=total
          )"
          python scripts/ci/ratchet.py --language python \
            --measured "$python_measured" \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/ratchet.py --language javascript \
            --measured "$javascript_measured" \
            --thresholds .github/ci-thresholds.json
          # The size, long-line and per-module coverage baselines ratchet
          # the other way: each follows a file down when it shrinks, so the
          # lines cannot come back for free. Growth is never written here —
          # that stays a decision a reviewer sees.
          python scripts/ci/size_baseline.py --tighten \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/line_lengths.py --tighten \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/js_module_coverage.py --tighten \
            "$NODE_V8_COVERAGE" \
            --thresholds .github/ci-thresholds.json
          python scripts/ci/thresholds.py --check \
            --thresholds .github/ci-thresholds.json
          paths='.github/ci-thresholds.json'
          if git diff --quiet -- $paths; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            # Two specifiers, two arguments. Splitting the second message
            # across a continuation would concatenate the halves with no
            # space between them, which is how this line lost one once.
            printf '%s %s\n' \
              "Python coverage ${python_measured}% and JavaScript coverage" \
              "${javascript_measured}% justified no raise; no module shrank, no file lost an over-limit line and no module lost an uncovered JavaScript line." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'changed=true'
              echo "python_measured=${python_measured}"
              echo "javascript_measured=${javascript_measured}"
            } >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- $paths
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the raise
        # A deploy key, not the built-in token, and the difference is not a
        # preference. `main requires green checks` lists `coverage` among its
        # required contexts — this job — so a commit pushed from here has no
        # green checks yet and the ruleset refuses it. GitHub Actions cannot be
        # added as a bypass actor either: the API answers "must be part of the
        # ruleset source or owner organization". A deploy key can, it is scoped
        # to this one repository rather than to an account, and revoking it is
        # deleting one key.
        #
        # A threshold-only push does not re-run tests or CodeQL;
        # audit.yml remains unfiltered.
        # Without the deploy key, changes remain in the summary.
        if: ${{ !cancelled() && steps.ratchet.outputs.changed == 'true'
                && env.RATCHET_SSH_KEY != '' }}
        env:
          RATCHET_SSH_KEY: ${{ secrets.RATCHET_SSH_KEY }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/ratchet_push.py .github/ci-thresholds.json \
            'ci: update CI ratchets'

  diff-coverage:
    # INFORMATIONAL, never a gate — which is why it is deliberately absent
    # from `aggregate` below. A comment that failed to post must not be able
    # to block a merge, and the number it reports is one a reviewer judges:
    # a refactor that only moves code, and a fix whose test lives behind an
    # optional dependency, both read low for reasons a threshold cannot tell
    # apart. The ratchet in `coverage` is the gate.
    #
    # Pull requests only, and only when coverage produced the artifact this
    # job consumes. A skipped ancestor must not hide that successful result.
    if: ${{ !cancelled() && needs.coverage.result == 'success'
               && github.event_name == 'pull_request' }}
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job reads the proposed tree, so it must not carry a token that can
    # write conversation. The trusted workflow_run commenter owns that token.
    permissions:
      contents: read

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The merge commit the event named, and the exact SHA `coverage`
          # measured. Resolving `refs/pull/N/merge` here instead would let
          # GitHub hand this job a different tree than the one the coverage
          # report describes.
          ref: ${{ github.sha }}
          # Both parents of that merge commit, which the diff below needs.
          fetch-depth: 0
          persist-credentials: false

      # actions/download-artifact v8.0.1
      - uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-xml

      - name: Install the pinned statement analyzer
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Measure the coverage of this change
        # HEAD is the merge tree checked out above and HEAD^1 is, by
        # construction, the base tip that was merged into it. The event
        # payload's `base.sha` is NOT that: the base branch can advance
        # between the event and the checkout, and every base commit merged in
        # since would then be reported as a line this pull request added.
        run: |
          git diff --text --no-ext-diff --no-textconv --unified=0 \
            HEAD^1 HEAD > patch.diff
          # Both reports live in the one coverage-xml artifact this job
          # downloaded; the comment says which languages it measured.
          python3 scripts/ci/diff_coverage.py \
            --coverage coverage.xml \
            --js-coverage javascript-coverage.xml \
            --diff patch.diff > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the comment for the trusted commenter
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - name: Upload the comment for the trusted commenter
        # actions/upload-artifact v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diff-coverage-comment
          path: |
            body.md
            pr-number.txt
          if-no-files-found: error


  # What seven real user journeys cost, counted in instructions rather than
  # in the wall clock a test function happened to take.
  #
  # It measures the TREE, not a verdict about it, so it names no `needs:` and
  # no `if:` — it runs on a documentation-only change, on a manual dispatch,
  # and on a tree whose correctness gates are red, because a number nobody
  # asked for is still a number worth having. It carries no `name:`: the job
  # id IS the check-run name, and a `name:` here would be the one that
  # renames it.
  journey-budget:
    runs-on: ubuntu-latest
    # Headroom over a measured run, not a figure derived from one. All
    # seven journeys finished this job in 9m06s (run 36968752929); the
    # three-journey run on main took 5m13s against the 45 minutes it was
    # allowed. Seven journeys therefore cost less than twice what three
    # cost, so 60 is several times what the measured run needs — room for
    # a slower runner, which is what a ceiling is for.
    timeout-minutes: 60
    env:
      # How many rounds the measurement takes. One is the steady state:
      # these counts are deterministic, so a discarded warm-up round buys
      # nothing. A higher value exists to derive a tolerance from a spread,
      # once, and is not what every run should pay for — three is how each
      # baseline's tolerance has been measured, on the per-journey number.
      JOURNEY_ROUNDS: "1"

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      # The MCP journey loads the real MCP front end, and the front end's own
      # dependencies are what a bare interpreter cannot import.
      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-dev.txt

      # perf is NOT installable here and must not be asked for again.
      # `perf_event_paranoid` is 4 on the hosted image, so `perf stat` is
      # refused without CAP_PERFMON, CAP_SYS_PTRACE or CAP_SYS_ADMIN — none
      # of which a hosted runner grants, and none of which apt can supply.
      # callgrind is userspace, so the same runner CAN count instructions
      # once valgrind is on it. That is the fallback this installs, and it
      # is why the counter is found by measurement below rather than named
      # here: a runner where the install silently failed must still report
      # what it found, not what this step intended.
      - name: Install valgrind, which supplies the instruction counter
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # TRANSIENT (issue 1499 experiment): a valgrind client request is
      # `asm volatile` inside a GNU statement expression, so pure Python
      # cannot issue one and the boundary is a helper this job compiles. It is
      # not part of the package and nothing outside this job loads it.
      - name: Build the counted-boundary marker
        run: |
          cat > "${RUNNER_TEMP}/cgzero.c" <<'EOF'
          #include <valgrind/callgrind.h>
          void daedalus_cg_zero_stats(void) { CALLGRIND_ZERO_STATS; }
          EOF
          cc -shared -fPIC -O2 -o "${RUNNER_TEMP}/cgzero.so" "${RUNNER_TEMP}/cgzero.c"
          echo "DAEDALUS_CALLGRIND_BOUNDARY=${RUNNER_TEMP}/cgzero.so" >> "$GITHUB_ENV"

      # What this runner actually allows, decided by measurement, and asked
      # AFTER the install above so the answer is about this runner as it will
      # measure. A counter it reports as unavailable is a counter the check
      # refuses to compare, not one it reads as "nothing over budget".
      # `--summary` writes that block ONLY where no counter is usable, so a
      # healthy runner prints an empty summary here by design.
      - name: Probe the counters
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/ci/journey_budget.py probe --summary

      # The rounds are the job's `JOURNEY_ROUNDS`, and the committed default
      # is one: these counts are deterministic, so a discarded warm-up round
      # buys nothing. More than one round is for deriving the tolerance from
      # a spread, once.
      - name: Measure the journeys
        id: measure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py measure --root . \
            --rounds "${JOURNEY_ROUNDS:-1}" --out "$COUNTS"

      # A re-baseline raises a recorded count, so it stays a reviewed commit.
      # What the refusal below prints is one command over THIS run's own
      # measurement, which is what travels with the run: a pasted block was
      # a reader copying numbers out of a table, and the copy is what went
      # wrong.
      - name: Upload the measured counts
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: journey-counts
          path: ${{ runner.temp }}/journey-counts.json
          if-no-files-found: error

      # The one verdict: over budget is a regression, and nothing below this
      # step runs when it is one.
      - name: Check the journeys against the budget
        id: check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py check --root . \
            --measurements "$COUNTS" --summary

      # The budget must follow a journey down on its own, or it sits at old
      # high counts until somebody remembers to lower them and a later
      # regression up to those counts passes. Down only: a run with a rise
      # writes nothing, and the check above must have concluded success, so
      # the run that found a regression writes nothing.
      #
      # A run where NO COUNT WAS COMPARED writes nothing too, and succeeds:
      # a recorded gate that moved — most often the runner image — means no
      # journey was checked, not that one regressed. Both say so in the step
      # summary, so a green run with no commit is that case rather than a
      # green that recorded something. Re-recording is `rebaseline`.
      - name: Follow the journeys that got cheaper
        id: tighten
        if: ${{ !cancelled() && steps.check.conclusion == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          COUNTS: ${{ runner.temp }}/journey-counts.json
        run: |
          python3 scripts/ci/journey_budget.py check --root . \
            --measurements "$COUNTS" --tighten
          if git diff --quiet -- .github/journey-budget.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One script, both jobs. `scripts/ci/ratchet_push.py` holds the deploy
      # key, the pinned host key and the discrimination between a refused
      # push and a concurrent one, so a second copy of a write credential
      # cannot exist here to drift from the coverage job's.
      - name: Commit the tighten
        if: ${{ !cancelled() && steps.tighten.outputs.changed == 'true'
                && env.RATCHET_SSH_KEY != '' }}
        env:
          RATCHET_SSH_KEY: ${{ secrets.RATCHET_SSH_KEY }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/ratchet_push.py .github/journey-budget.json \
            'ci: tighten the journey budget'

  aggregate:
    name: Aggregate workflow checks
    if: ${{ always() }}
    needs:
      - changes
      - pycodestyle
      - pylint
      - pyright
      - eslint
      - actionlint
      - suites
      - wheel
      - coverage-matrix
      - coverage
      - journey-budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one rather than adding
    # to it: contents read pays for the checkout, actions read is what lets
    # GITHUB_TOKEN list this workflow's runs for the supersession check.
    permissions:
      contents: read  # the checkout
      actions: read  # the workflow-run reads

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # scripts/ci/aggregate_gate.py owns the verdict, including the
      # superseded-cancel rule: a cancelled dependency whose run a strictly
      # newer run of this workflow replaced gates nothing, while a
      # deliberate cancel stays a failure.
      - name: Check dependency results
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: python3 scripts/ci/aggregate_gate.py
