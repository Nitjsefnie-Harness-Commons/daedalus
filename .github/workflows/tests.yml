name: tests

# PROBE-ONLY TRIM. Disposable branch, never merged. The real tests.yml is on
# the base; this copy keeps only the aggregate job and one trivial dependency
# so the gate's verdict arrives in minutes instead of after the twelve-leg
# matrix. What it preserves is the path under test: the same script, the same
# needs-driven verdict, the same secrets query, the same exit status.
# What it drops is the dependency set the real job waits on, which is not what
# this probe is measuring.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo base

  aggregate:
    name: Aggregate workflow checks
    if: ${{ always() }}
    needs:
      - probe-base
    runs-on: ubuntu-latest
    # Two numbers, and the gap between them is the reason for both. The
    # poll bound (SECRETS_POLL_BOUND_S below) is 12 minutes: the gitleaks
    # job carries its own 10-minute backstop and the rest is queueing.
    # This ceiling is 8 minutes above it, so the job is still alive to
    # print the verdict and conclude cleanly when the wait ends — a
    # ceiling under the bound would kill the job instead of judging it.
    timeout-minutes: 20
    # A job-level block replaces the workflow-level one rather than adding
    # to it: contents read pays for the checkout, actions read is what lets
    # GITHUB_TOKEN list workflow runs for the supersession check and the
    # secrets verdict.
    permissions:
      contents: read  # the checkout
      actions: read  # the workflow-run reads

    steps:
      # actions/checkout v7.0.1
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      # scripts/ci/aggregate_gate.py owns the verdict, including the
      # superseded-cancel rule: a cancelled dependency whose run a strictly
      # newer run of this workflow replaced gates nothing, while a
      # deliberate cancel stays a failure.
      #
      # It also requires the `secrets` workflow's gitleaks job on this head
      # SHA. That job is in no `needs:` set and no required context of this
      # repository, so `needs:` cannot reach it and a pull request whose
      # scan is red would otherwise merge green (issue 1491).
      #
      # No event skips it, workflow_dispatch included: a dispatch publishes
      # its check run on the SHA it ran against, and GitHub reads required
      # contexts off the check runs on the pull request head whatever event
      # produced them — a skip here would be a bypass. The cost is that a
      # manual run at a SHA with no `secrets` run goes red once the bound
      # expires, which is what
      # `gh workflow run secrets.yml --ref <branch>` is for.
      - name: Check dependency results
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SECRETS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SECRETS_POLL_BOUND_S: '720'
        run: python3 scripts/ci/aggregate_gate.py
