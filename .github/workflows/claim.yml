name: claim

# Lets a contributor take an issue without repository write access. GitHub's
# built-in slash commands do not include assignment, so self-assignment
# otherwise needs someone with write access to use the assignee control.
#
# `/claim` assigns the commenter to an unassigned open issue. `/unclaim` and
# `/release` are the same command under two names — either removes only the
# commenter's own assignment, and a hand-made one goes with it. Another
# holder's assignment is removed only once it has expired, on this action's own
# `/release` by an actor with write access, and only when this action made it.
# Two names because the reference implementation this was modelled on calls it
# `/release` and people arrive expecting that word.
#
# The action handles the attacker-controlled comment body without
# interpolating it into shell source. The `if:` below is only a cheap
# prefilter; the exact match happens in the action, because expressions have
# no trim(). A closed issue and a pull request are the action's to refuse,
# not this job's: it declines both loudly — a reply naming the command word
# and a failed run — where a condition here would skip the run and leave the
# commenter with no answer at all.

on:
  issue_comment:
    types: [created]

concurrency:
  # Per issue, so two claims on one issue are answered one after the other and
  # the first of a race still wins it.
  #
  # A group holds one PENDING run by default, and a newly queued run cancels
  # and replaces that one whatever `cancel-in-progress` says — so a third
  # claim arriving while one runs would drop the second commenter's claim with
  # no answer and no assignment. `queue: max` holds up to 100 pending runs
  # instead and cancels only past the 100th, which is as far as the guarantee
  # goes. `queue: max` may not be combined with `cancel-in-progress: true`, so
  # the false below is required, not merely chosen.
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  claim:
    # A bot's comment is never a claim, and a body carrying a command word
    # is worth a runner. That is the whole prefilter.
    if: >-
      github.event.comment.user.type != 'Bot'
      && (contains(github.event.comment.body, '/claim')
          || contains(github.event.comment.body, '/unclaim')
          || contains(github.event.comment.body, '/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The narrowest token that can assign. Nothing here reads the tree, so there
    # is no contents: read and no checkout: the job talks to the API only.
    permissions:
      issues: write

    steps:
      # Caps are keyed by repository role, and an account the repository does
      # not know falls in the `read` bucket. Reaching one is a reply on the
      # issue naming the role, the cap and your count, never a silent no-op.
      # The expiry below runs from when the holder was assigned, not from their
      # last activity, so a claim can lapse while its holder still works the
      # issue; another commenter's `/claim` takes it over.
      - uses: Nitjsefnie-Actions/claim@8abff4f2f27d59b984528cb736f64b9391952a25  # v2.0.1
        with:
          max-claims: 'read=2, triage=4, write=6, maintain=10, admin=-1'
          expire: '7'
