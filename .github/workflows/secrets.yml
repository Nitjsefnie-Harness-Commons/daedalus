name: secrets

# Secret-scan gate: gitleaks sweeps the full tree and the full git history
# on every run, catching the credential GitHub's push protection does not —
# push protection covers provider-recognised patterns only, so an ad-hoc
# token, a session cookie, or a private URL with embedded credentials
# reaches main unremarked. This gate does not.
#
# THE CRON IS THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history anyway,
# so such a commit is scanned the next morning rather than never.
#
# THE BINARY IS FROZEN BY HAND. The version is pinned and digest-verified,
# so no run ever scans with a silently changed scanner — and every bump
# rescans the whole history under the new rules, which is the price of the
# bump. The scanner is the binary rather than gitleaks-action because that
# action requires a GITLEAKS_LICENSE secret on organization accounts, and
# this repository's org would have to hold one just to be scanned.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and not 04:12 (audit) or 03:47 Wednesday (codeql).
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here.
        run: ./gitleaks detect --redact --config .gitleaks.toml
