name: secrets

# Secret-scan gate: Nitjsefnie-Actions/secret-scan runs gitleaks over the
# whole tree and git history on every run, catching the credential GitHub's
# push protection does not: push protection covers provider-recognised
# patterns only, so an ad-hoc token, a session cookie, or a private URL with
# embedded credentials reaches main unremarked.
#
# THE CRON IS THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history anyway,
# so such a commit is scanned the next morning rather than never.
#
# The action reads .gitleaks.toml and .gitleaksignore from the commit the
# change is judged against (a pull request's base, a push's previous tip,
# otherwise the default branch's tip), so a change cannot exempt its own
# finding.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and not 04:12 (audit) or 03:47 Wednesday (codeql).
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group per commit on push, dispatch and schedule: a landed main SHA's
# verdict must complete, so a newer push cannot cancel it. A pull request
# keeps one group per number, so a superseded head push is still cancelled.
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action scans the whole history, so it needs a full-history
          # checkout.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@f6b0956e1bfea8aec4a4524032c3e7bbbc35b28b # v1.1.0
