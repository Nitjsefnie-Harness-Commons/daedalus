name: secrets

# Secret-scan gate: gitleaks sweeps the full tree and the full git history
# on every run, catching the credential GitHub's push protection does not —
# push protection covers provider-recognised patterns only, so an ad-hoc
# token, a session cookie, or a private URL with embedded credentials
# reaches main unremarked.
#
# THE CRON IS THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history anyway,
# so such a commit is scanned the next morning rather than never.
#
# THE RULES COME FROM THE TRUSTED COMMIT. The config and ignore list are
# read from the pull request's base or the push's previous commit, never
# from the tree being judged, so a change cannot exempt its own finding;
# --ignore-gitleaks-allow closes the inline-marker route the same way.
#
# THE BINARY IS FROZEN BY HAND. The version is pinned and digest-verified,
# so no run ever scans with a silently changed scanner — and every bump
# rescans the whole history under the new rules, which is the price of the
# bump. The scanner is the binary rather than gitleaks-action because that
# action requires a GITLEAKS_LICENSE secret on organization accounts, and
# this repository's org would have to hold one just to be scanned.

on:
  push:
    # main only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and not 04:12 (audit) or 03:47 Wednesday (codeql).
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group per commit on push, dispatch and schedule: a landed main SHA's
# verdict must complete, so a newer push cannot cancel it. A pull request
# keeps one group per number, so a superseded head push is still cancelled.
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Refuse a shallow clone
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::The secret scan reads the full git history; a shallow clone would scan a suffix and call the rest clean" >&2
            exit 1
          fi

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 120 --retry 3 --retry-all-errors --retry-delay 5 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Take the scan's config and ignore list from the trusted commit
        # Read from the judged tree, they would let a change exempt its own finding.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          MAIN_REF: refs/remotes/origin/main
        run: |
          case "$EVENT_NAME" in
            pull_request) trusted="$BASE_SHA" ;;
            push) trusted="$BEFORE_SHA" ;;
            # Main's tip, whichever branch a dispatch scans.
            *) trusted="$(git rev-parse --verify --quiet "$MAIN_REF")" || trusted= ;;
          esac
          # An empty name would read the index, the judged tree.
          read_trusted() {
            case "$trusted" in '' | *[!0-9a-f]*) return 1 ;; esac
            git cat-file blob "$trusted:$1"
          }
          dir="$RUNNER_TEMP/gitleaks-trusted"
          mkdir "$dir"
          if ! read_trusted .gitleaks.toml > "$dir/.gitleaks.toml"; then
            echo "no .gitleaks.toml at trusted commit '$trusted': default rules"
            printf '[extend]\nuseDefault = true\n' > "$dir/.gitleaks.toml"
          fi
          if ! read_trusted .gitleaksignore > "$dir/.gitleaksignore"; then
            echo "no .gitleaksignore at trusted commit '$trusted': nothing ignored"
          fi
          python3 -I - "$dir/.gitleaks.toml" <<'PY'
          import sys
          import tomllib

          def keys(table, prefix=""):
              for key, value in table.items():
                  name = prefix + key.lower()
                  yield name, value
                  if isinstance(value, dict):
                      yield from keys(value, name + ".")

          with open(sys.argv[1], "rb") as config:
              if any(n == "extend.path" and v != "" for n, v in keys(tomllib.load(config))):
                  sys.exit("trusted .gitleaks.toml sets [extend] path, which gitleaks "
                           "resolves inside the judged checkout: refusing to scan")
          PY

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here.
        # The log is public: --verbose names findings, --redact masks them.
        # The judged tree's .gitleaksignore, diff attributes and
        # gitleaks:allow markers are its own exemptions, so none applies.
        #
        # --log-opts bounds the walk to HEAD, the ref this run checked out.
        # Left to itself gitleaks runs `git log -p -U0 --full-history
        # --all --diff-filter=tuxdb`, and fetch-depth 0 has fetched every
        # branch, so another branch's commits decided this run's verdict.
        # `--full-history --diff-filter=tuxdb` are that command's own
        # arguments, kept; the rev is the addition. Shell quoting is what
        # hands gitleaks one argument rather than three.
        #
        # fetch-depth: 0 stays because the bound is a RANGE, not a shallow
        # fetch: HEAD's own FULL history is what must be scanned, and a
        # shallow clone would scan a suffix of it and call the rest clean.
        env:
          ATTRIBUTES: .git/info/attributes
        run: |
          rm -rf .gitleaksignore
          echo '* !diff' > "$ATTRIBUTES"
          ./gitleaks detect --verbose --redact --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted" \
            --log-opts='--full-history --diff-filter=tuxdb HEAD'
