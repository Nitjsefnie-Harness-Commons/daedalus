name: pr claim

# `pull_request_target` is required because a fork's `pull_request` token is
# read-only, so its comment and close would silently do nothing. This trigger
# runs the base branch's workflow with a writable token. It is safe here
# because checkout keeps the default base ref, the job runs no pull-request
# code, and only the body's TEXT crosses into the script through the
# environment.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened]

# pull-requests: write explains and closes; issues: read checks assignment.
# The job reads no tree beyond the base checkout.
permissions:
  pull-requests: write
  issues: read

concurrency:
  # Opposite `claim.yml`: racing claims are two people who each need an
  # answer, while quick edits are two answers to one question and only the
  # newest body matters.
  group: pr-claim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claim:
    # An edit also fires on a closed pull request. Leave maintainer-closed
    # work alone, and do not spend a runner deciding that a bot is exempt.
    # This workflow never reopens anything.
    if: >-
      github.event.pull_request.state == 'open'
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require a claimed issue
        # The body is contributor-controlled. Expressions stay in `env:` and
        # are never interpolated into the shell that consumes it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          numbers="$(printf '%s' "$BODY" \
            | python3 scripts/ci/pr_claim.py \
            | tr -d '\r')"
          # The parser emits only digits and newlines; deliberate splitting
          # makes the complete list countable before any lookup.
          # shellcheck disable=SC2086
          set -- $numbers
          # Twenty supports unusually broad multi-issue changes while keeping
          # the API work safely inside this job's five-minute budget.
          if [ "$#" -le 20 ]; then
            for N in "$@"; do
              if lookup="$(gh api --include "repos/$REPO/issues/$N" \
                --jq 'if has("pull_request") then empty else
                  (.assignees[].login | "assignee:\(.)") end')"
              then
                assignees="$(printf '%s\n' "$lookup" \
                  | sed -n 's/^assignee://p')"
              else
                status="$(printf '%s\n' "$lookup" \
                  | sed -n \
                    '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"
                if [ "$status" = 404 ]; then
                  continue
                fi
                printf 'failed to look up issue %s (HTTP %s)\n' \
                  "$N" "${status:-unknown}" >&2
                exit 1
              fi
              if printf '%s\n' "$assignees" | grep -Fxq "$ACTOR"; then
                echo "pull request $PR is covered by claimed issue $N"
                exit 0
              fi
            done
          else
            printf 'pull request %s names more than 20 issue references\n' \
              "$PR" >&2
          fi

          comment_file="$(mktemp)"
          trap 'rm -f "$comment_file"' EXIT
          printf '@%s' "$ACTOR" > "$comment_file"
          cat <<'COMMENT' >> "$comment_file"
           — closing this automatically, and it is recoverable: read on.

          A pull request here has to name the issue it resolves, in its
          **Related Issues and Pull Requests** section, and that issue has to be
          assigned to you before you start. This one does not, so nothing tells other
          contributors that the work is taken.

          Two steps, in this order:

          1. Comment `/claim` on the issue you are fixing. That assigns it to you, no
             write access needed — see CONTRIBUTING.md.
          2. Edit this pull request's body so its **Related Issues and Pull Requests**
             section names that issue: `Fixes #<issue>`, with the real number.

          Then reopen this same pull request. A closed pull request still accepts edits
          and comments, so there is no need to open a second one and nothing here is
          lost.
          COMMENT
          # If the explanation cannot be posted, leave the pull request open
          # rather than close it silently.
          gh api "repos/$REPO/issues/$PR/comments" \
            -F "body=@$comment_file" --silent
          gh api -X PATCH "repos/$REPO/pulls/$PR" \
            -f state=closed --silent
