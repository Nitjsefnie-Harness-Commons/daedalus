name: release

# Publishes the wheel a consumer installs. The checksum file is not optional
# decoration: an installer that fetches "the newest release" has no other way
# to prove it got the artifact this workflow built, so SHA256SUMS ships beside
# the wheel and the installer verifies against it before installing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # FIRST, before a checkout, an install, a test run or a build. This job
      # holds contents: write, and workflow_dispatch accepts any ref — so a
      # manual run started on a branch reached the publishing step, where the
      # action defaults tag_name to github.ref_name and would cut a release
      # named after the branch. The version-versus-tag check below could not
      # catch that: it only ran when the ref was already a tag.
      - name: Refuse a run that is not on a v* tag
        if: ${{ github.ref_type != 'tag' || !startsWith(github.ref_name, 'v') }}
        env:
          # Through the environment, not interpolated into the script: a ref
          # name is caller-controlled text.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "release publishes only from a v* tag; this run is on" >&2
          echo "$REF_TYPE '$REF_NAME'. Tag the commit and let the tag push" >&2
          echo "start the release, or dispatch this workflow on that tag." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build backend and the MCP dependencies
        # The MCP suite skips without them, so a release could otherwise
        # publish after every MCP behaviour test quietly skipped.
        run: python -m pip install --upgrade pip build . ".[mcp]"

      # A mistagged release publishes a wheel whose version contradicts the
      # tag, and the checksums then make the wrong pairing authoritative.
      - name: Refuse a tag that does not match the version being built
        # No `if:` any more — the guard above has already established that
        # this run is on a v* tag, so this check is unconditional rather
        # than skipping itself on exactly the refs it could not vouch for.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(python -c "import daedalus_cli; print(daedalus_cli.__version__)")
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $built" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $built"

      - name: Run every suite before publishing anything
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

      - name: Build the wheel
        run: python -m build --wheel

      - name: Publish checksums beside the wheel
        working-directory: dist
        # `--` so a wheel whose name began with a dash would be read
        # as a file rather than as options (shellcheck SC2035).
        run: sha256sum -- *.whl > SHA256SUMS

      - name: Attach the wheel and its checksums to the release
        # zizmor: ignore[superfluous-actions] — `gh release` can upload
        # these files, but this step also creates the release with generated
        # notes on a tag push, and rewriting the one path that publishes the
        # artifacts is a change that belongs on its own, after it has been
        # proved by a release rather than alongside a lint fix.
        #
        # v3.0.0 moved the action's runtime from Node 20 to Node 24 and
        # changed no inputs; this step passes only `files` and
        # `generate_release_notes`. The SHA was re-resolved against
        # upstream's annotated v3.0.2 tag rather than taken from the bot.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
          generate_release_notes: true
