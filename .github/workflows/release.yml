name: release

# Publishes the wheel a consumer installs. The checksum file is not optional
# decoration: an installer that fetches "the newest release" has no other way
# to prove it got the artifact this workflow built, so SHA256SUMS ships beside
# the wheel and the installer verifies against it before installing.
#
# SHA256SUMS proves the published files go together. It does NOT prove where
# they came from — it is published by the same authority as the artifacts, so
# anything that could replace one could replace both. Build provenance is the
# other half: a signed statement naming this workflow, this commit and the
# runner that produced each file, verifiable with `gh attestation verify
# <file> --repo <repo>` against GitHub rather than against this repository's
# own word.
#
# Immutable releases are enabled on the repository, so a published release's
# assets cannot be replaced at all. The pre-flight below refuses the same
# attempt earlier, before a full suite run and a build have been spent on it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # contents: write publishes the release. id-token and attestations are what
  # the provenance step needs — it mints a short-lived OIDC token to prove to
  # GitHub's attestation service which workflow is speaking, and writes the
  # resulting statement. Neither can be narrowed further, and this stays the
  # only job in the repository holding any of the three.
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # FIRST, before a checkout, an install, a test run or a build. This job
      # holds contents: write, and workflow_dispatch accepts any ref — so a
      # manual run started on a branch reached the publishing step, where the
      # action defaults tag_name to github.ref_name and would cut a release
      # named after the branch. The version-versus-tag check below could not
      # catch that: it only ran when the ref was already a tag.
      - name: Refuse a run that is not on a v* tag
        if: ${{ github.ref_type != 'tag' || !startsWith(github.ref_name, 'v') }}
        env:
          # Through the environment, not interpolated into the script: a ref
          # name is caller-controlled text.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "release publishes only from a v* tag; this run is on" >&2
          echo "$REF_TYPE '$REF_NAME'. Tag the commit and let the tag push" >&2
          echo "start the release, or dispatch this workflow on that tag." >&2
          exit 1

      - name: Refuse a tag whose release already carries artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Immutable releases refuse the replacement at the API, but they refuse
        # it after the suite has run and the wheel has been built — and a run
        # that fails there reads as a release that nearly worked. A tag whose
        # release already carries assets has been published; publishing it
        # again is a different artifact under the same name. Branch on the exit
        # code, never the output: `gh api` prints its JSON error body to stdout
        # on a 404 and exits nonzero.
        run: |
          if assets="$(gh api -H "Cache-Control: no-cache" \
                         "repos/$REPO/releases/tags/$TAG" \
                         --jq '.assets | length' 2>/dev/null)"; then
            if [ "$assets" != 0 ]; then
              echo "$TAG is already published with $assets assets. A release" >&2
              echo "is cut once; to ship a change, bump the version and tag" >&2
              echo "the new commit." >&2
              exit 1
            fi
            echo "A release exists for $TAG but carries no assets; continuing."
          else
            echo "No release exists for $TAG yet."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, and a token left in .git/config
          # is reusable by every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build backend and the MCP dependencies
        # The MCP suite skips without them, so a release could otherwise
        # publish after every MCP behaviour test quietly skipped.
        run: python -m pip install --upgrade pip build . ".[mcp]"

      # A mistagged release publishes a wheel whose version contradicts the
      # tag, and the checksums then make the wrong pairing authoritative.
      - name: Refuse a tag that does not match the version being built
        # No `if:` any more — the guard above has already established that
        # this run is on a v* tag, so this check is unconditional rather
        # than skipping itself on exactly the refs it could not vouch for.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(python -c "import daedalus_cli; print(daedalus_cli.__version__)")
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $built" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $built"

      - name: Run every suite before publishing anything
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

      - name: Build the wheel and the source distribution
        # Both formats. The wheel is what almost everyone installs, but it is
        # a built artifact: the sdist is what lets someone rebuild it, audit
        # what went into it, or install on a platform no wheel targets. A
        # release that ships only the wheel makes the git tag the sole source
        # of the source, which is exactly the thing checksums exist to avoid
        # depending on.
        run: python -m build

      - name: Publish checksums beside the artifacts
        working-directory: dist
        # `--` so an artifact whose name began with a dash would be read
        # as a file rather than as options (shellcheck SC2035). Both formats
        # are checksummed: an artifact published without one is an artifact
        # nobody can verify, which is the whole reason this file exists.
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Attest what this run built
        # Runs before the upload, so a release never carries an artifact whose
        # provenance failed to record. The subjects are the artifacts
        # themselves rather than SHA256SUMS: a consumer verifies the file they
        # installed, not a file that describes it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attach the wheel and its checksums to the release
        # zizmor: ignore[superfluous-actions] — `gh release` can upload
        # these files, but this step also creates the release with generated
        # notes on a tag push, and rewriting the one path that publishes the
        # artifacts is a change that belongs on its own, after it has been
        # proved by a release rather than alongside a lint fix.
        #
        # v3.0.0 moved the action's runtime from Node 20 to Node 24 and
        # changed no inputs; this step passes only `files` and
        # `generate_release_notes`. The SHA was re-resolved against
        # upstream's annotated v3.0.2 tag rather than taken from the bot.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
