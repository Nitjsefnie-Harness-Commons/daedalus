# TRANSIENT — issue 1495, second profiling round. Delete before the go.
# Every journey, not just net-capture: the recorded `journey-counts`
# artifacts cannot answer how much of a journey's work the bridge's own
# request threads carry, because `journey_threads.role_of` reads every
# thread of a non-journey process that lacks the front end's init symbol
# as `uvicorn-serve`, and every journey but `mcp-exec` excludes that
# role — so those threads are in neither the journey's kept total nor the
# `bridge-only` baseline it is subtracted against.
name: journey profiles (transient)

on:
  push:
    branches: ['issue-1495-netcapture-journey']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-dev.txt

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Profile every journey and the baseline, three rounds each
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/profiles"
          for round in 1 2 3; do
            for name in net-capture screenshot cdp-result command-round-trip \
                        segment-relay dashboard-fanout mcp-exec bridge-only; do
              out="${RUNNER_TEMP}/profiles/${name}.${round}"
              mkdir -p "$out"
              echo "=== ${name} round ${round}"
              valgrind --tool=callgrind --trace-children=yes \
                --separate-threads=yes \
                "--callgrind-out-file=${out}/cg.%p" \
                python3 tests/_journeys.py --journey "$name" --root . \
                > "${out}/stdout.txt" 2> "${out}/stderr.txt" || true
            done
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: journey-profiles
          path: ${{ runner.temp }}/profiles
          if-no-files-found: error