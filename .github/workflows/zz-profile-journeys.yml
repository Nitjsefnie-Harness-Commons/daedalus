# TRANSIENT — issue 1495 profiling. Delete before the go.
name: journey profiles (transient)

on:
  push:
    branches: ['issue-1495-netcapture-journey']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install the test dependencies and project
        run: |
          python -m pip install --upgrade pip . ".[mcp]"
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-dev.txt

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Profile the net-capture journey and its baseline, five rounds each
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/profiles"
          for round in 1 2 3 4 5; do
            for name in net-capture bridge-only; do
              out="${RUNNER_TEMP}/profiles/${name}.${round}"
              mkdir -p "$out"
              echo "=== ${name} round ${round}"
              valgrind --tool=callgrind --trace-children=yes \
                --separate-threads=yes \
                "--callgrind-out-file=${out}/cg.%p" \
                python3 tests/_journeys.py --journey "$name" --root . \
                > "${out}/stdout.txt" 2> "${out}/stderr.txt" || true
            done
          done

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: journey-profiles
          path: ${{ runner.temp }}/profiles
          if-no-files-found: error