name: gate freshness

# Publish a `gate freshness` verdict on every open pull request head based on
# `main`, so only branches that PREDATE A NEW GATE are forced to rebase. The
# decision, the gate-defining path set, and the bound all live in
# scripts/ci/gate_freshness.py; its module docstring is the contract.
#
# WHY THE SCRIPT PUBLISHES RATHER THAN RELYING ON THE JOB. On a push to `main`
# this job's own check run lands on `main`, where no ruleset reads it, so the
# verdict every ruleset sees must be written onto each pull request HEAD by the
# script. The job is therefore named `publish freshness` -- deliberately NOT
# the published context `gate freshness` -- so no ruleset reading by context
# can ever match two different things under one name. The job's own check is
# informational; the published one is the gate.
#
# WHY `pull_request_target` IS SAFE HERE. On this trigger BOTH halves come from
# the BASE: the workflow text and the `actions/checkout` copy are the trusted
# base branch, and the only head data used is the SHA/ref/owner from the event
# payload -- the script never checks out, imports, or executes anything from
# the pull request. That is the whole safety argument. (A `pull_request` run
# would take its workflow text from the merge ref while running a script from
# the branch SHA, and the two can disagree.)
#
# THE BOUND, SIZED. The run refuses when its worst case (open PRs x gate
# commits compares + per-head overhead) exceeds DEFAULT_CALL_BUDGET calls. At
# ASSUMED_SECONDS_PER_CALL (1.5 s, the conservative measured rate) that budget
# needs 1200*1.5/60 = 30 minutes, so `timeout-minutes` below is 35: the timeout
# clears the enforced budget rather than merely sitting above it. See THE BOUND
# in scripts/ci/gate_freshness.py, whose test pins this relation.
on:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: gate-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-freshness:
    name: publish freshness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Publish the gate freshness verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gate_freshness.py
