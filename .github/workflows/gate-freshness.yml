name: gate freshness

# Publish freshness for open heads based on main: only heads predating a new
# gate must rebase. scripts/ci/gate_freshness.py owns the decision, path set
# and bound; its module docstring is the contract.
#
# JOB CONTEXT. A job check lands in this run's own suite, newest for this
# workflow on the head, which the ruleset counts. API-created checks were
# observed in the app's oldest suite, invisible once superseded (issue #1655);
# callers cannot choose that suite.
#
# SCRIPT PUBLICATION. On a push to main the job check lands on main, where no
# ruleset reads it. The script PATCHes only checks it created; runner-owned
# verdicts stay with their runner. Push re-decides open heads and dispatches a
# fresh run on a stale head unless its newest check is already red. Dispatch
# problems are loud skips. A dispatched run fetches main's snapshot of the
# gate script and executes that source with a recursion marker.
#
# BASE SAFETY. pull_request_target takes BOTH the workflow and checkout from
# the trusted base. Only SHA/ref/owner come from the event; no PR content is
# checked out, imported or executed. pull_request would take workflow text
# from the merge ref and script from the branch SHA, which may disagree.
#
# THE BOUND: L + 4 + H * (G + 7): L path lookups + up to four setup reads
# (snapshot, PR list, bootstrap source and repeated PR list), then H heads x
# (G compares + seven calls, including workflow contents and dispatch).
# Extra ids and pages are unbounded by this estimate. At 1.5 s/call, 1200 calls
# take 30 minutes; the 35-minute timeout provides residual slack.
#
# BASE FILTER. A non-main PR could earn an authoritative green without a main
# comparison; retargeting to main reuses that SHA and its unearned check.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

# The non-pull-request fallback is the commit SHA, not the ref, so a newer
# push cannot cancel a landed main SHA's in-flight verdict (issue #1579).
# A pull request keeps one group per number.
concurrency:
  group: gate-freshness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  publish-freshness:
    name: gate freshness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Publish the gate freshness verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gate_freshness.py
