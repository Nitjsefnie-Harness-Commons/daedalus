name: gate freshness

# scripts/ci/gate_freshness.py owns freshness, gate paths and the call budget.
#
# JOB CONTEXT. The event job carries its own verdict. API-created checks can
# land in the app's oldest suite, ignored once superseded (issue #1655).
#
# SCRIPT PUBLICATION. PATCH only script-owned checks. Push keeps fresh or
# already-red heads and re-runs other heads' event runs only when this workflow
# and gate script match main's checkout byte for byte. Edited definitions and
# unreadable files skip loudly. Re-runs retain the PR-associated check suite.
#
# BASE SAFETY. pull_request_target uses the base workflow and checkout;
# Head SHA, ref and repository come from the event; no PR code runs.
# -I excludes adjacent modules, PYTHONPATH and user site imports.
#
# THE BOUND: L + 2 + H * (G + 8): L path lookups + snapshot and PR list,
# then H heads x (G compares + eight calls, including both gate files,
# one runs-list read and one rerun POST).
# Extra ids and pages are unbounded by this estimate. At 1.5 s/call, 1200 calls
# take 30 minutes; the 35-minute timeout provides residual slack.
#
# BASE FILTER. A non-main PR could earn an authoritative green without a main
# comparison; retargeting to main reuses that SHA and its unearned check.
on:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

# The non-pull-request fallback is the commit SHA, not the ref, so a newer
# push cannot cancel a landed main SHA's in-flight verdict (issue #1579).
# A pull request keeps one group per number.
concurrency:
  group: gate-freshness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  publish-freshness:
    name: gate freshness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Publish the gate freshness verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/gate_freshness.py
