name: gate freshness

# Publish a `gate freshness` verdict on every open pull request head based on
# `main`, so only branches that PREDATE A NEW GATE are forced to rebase. The
# decision, the gate-defining path set, and the bound all live in
# scripts/ci/gate_freshness.py; its module docstring is the contract.
#
# WHY THE JOB CARRIES THE CONTEXT. Its check run is created in this run's
# own suite, the newest suite of this workflow on the head, which the ruleset
# counts. An API-created check lands in the app's oldest suite on the commit
# and is invisible once superseded (issue #1655).
#
# WHY THE SCRIPT PUBLISHES. On a push to `main` this job's check lands
# on `main`, where no ruleset reads it. The script re-decides every open head
# and PATCHes each head's newest completed `gate freshness` check instead.
#
# WHY `pull_request_target` IS SAFE HERE. On this trigger BOTH halves come from
# the BASE: the workflow text and the `actions/checkout` copy are the trusted
# base branch, and the only head data used is the SHA/ref/owner from the event
# payload -- the script never checks out, imports, or executes anything from
# the pull request. That is the whole safety argument. (A `pull_request` run
# would take its workflow text from the merge ref while running a script from
# the branch SHA, and the two can disagree.)
#
# THE BOUND, SIZED. The run refuses when its fixed estimate (open PRs x gate
# commit compares + four calls per head) exceeds DEFAULT_CALL_BUDGET calls.
# This assumes one old check per head; duplicate old ids can exceed it, with
# one extra PATCH per additional id. At ASSUMED_SECONDS_PER_CALL (1.5 s/call),
# the 1200-call budget is 30 minutes; the 35-minute workflow timeout provides
# slack for that residual. See THE BOUND in scripts/ci/gate_freshness.py.
on:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write
  contents: read
  pull-requests: read

# The non-pull-request fallback is the commit SHA, not the ref, so a newer
# push cannot cancel a landed main SHA's in-flight verdict (issue #1579).
# A pull request keeps one group per number.
concurrency:
  group: gate-freshness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  publish-freshness:
    name: gate freshness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Publish the gate freshness verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gate_freshness.py
