# The actions in .github/workflows/ are pinned to commit SHAs, which is the
# point — a tag is a moving pointer and a SHA is not. The cost is that
# nothing updates them, so this asks Dependabot for one pull request per
# action when a new release appears; it rewrites the SHA and the trailing
# version comment together, which makes a refresh a reviewed change rather
# than a silent one.
#
# Wednesday and off the hour, for the same reason the workflow crons are:
# every schedule on GitHub fires at :00 on Monday, and jobs queue there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "05:17"
    open-pull-requests-limit: 4
    commit-message:
      prefix: ci
    # `github/codeql-action/init` and `github/codeql-action/analyze` are two
    # dependencies to Dependabot and one component to CodeQL, which refuses to
    # run when the two `uses:` lines name different versions. Ungrouped, the
    # bump arrived as two pull requests that could each only be red, and
    # merging either one left main red until the other landed. The group makes
    # the pair one proposal.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # `actions/cache/restore` and `actions/cache/save` are one action to the
      # workflow's pin — one commit per family, and a run that names two — and
      # two dependencies to Dependabot. Ungrouped, a version bump arrives as
      # two pull requests that each leave the family pin red.
      cache:
        patterns:
          - "actions/cache*"

  # The Python surface: the `mcp` extra in pyproject.toml, which is the only
  # third-party code that runs in production, and the lint/type/coverage pins
  # in requirements-dev.txt and requirements-test.txt. All three live at the
  # repository root, so one entry covers them.
  #
  # audit.yml answers "is what we froze still safe" on a daily cron; this
  # answers "is there something newer", which is the half a scanner cannot do.
  # Neither replaces the other, and both are needed because the pins exist to
  # stop a tool release turning CI red on an unchanged commit — a pin nobody
  # ever moves is how a dependency quietly ages out of support.
  #
  # Later in the Wednesday window than the actions entry, so the two do not
  # open their pull requests in the same minute.
  - package-ecosystem: pip
    directory: /
    # Every Python dependency here is pinned exactly, so what arrives is one
    # pull request per package that moved, carrying the version CI is about
    # to test. The setting is belt-and-braces for a bound added later: it
    # moves a range only when the current one cannot accept the new version,
    # rather than rewriting a deliberate bound because something newer
    # shipped.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: wednesday
      time: "05:41"
    open-pull-requests-limit: 4
    commit-message:
      prefix: build
