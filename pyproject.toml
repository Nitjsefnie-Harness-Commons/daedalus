[build-system]
# Pinned exactly, like every other dependency here: pip's build isolation
# resolves this line, so a floor means the wheel is built by whatever shipped
# most recently rather than by the version anyone tested.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-cli"
dynamic = ["version"]
description = "Command-line client for a Daedalus browser bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nitjsefnie" }]
keywords = ["browser", "automation", "chrome-extension", "mcp", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# Stdlib only, deliberately: the CLI is what an agent shells out to, often once
# per step, so its import cost is paid constantly and a dependency tree here
# would be a tax on every call. The MCP server has real dependencies and is not
# part of this wheel for exactly that reason.
dependencies = []

# The MCP server is not part of the wheel, but its dependencies are declared
# so a checkout can install them in one step and the type checker can resolve
# them in CI. `pip install .[mcp]` when you intend to run `python3 -m daedalus_mcp.server`.
[project.optional-dependencies]
# Pinned exactly rather than floored. A floor is a claim about the oldest
# version that works, and nothing here ever tested one: CI installs the newest
# resolvable version on every leg, so the floor recorded a version no run had
# ever exercised while leaving a resolver free to land on one carrying an
# advisory pip-audit never saw. An exact pin is the version that was tested.
#
# What each one is for. mcp must be 2.x: the server is written against
# mcp.server.mcpserver, which is where 2.0 moved the ergonomic server
# interface, and 1.x has no such module. httptools is what uvicorn serves on
# when it is importable; without it uvicorn falls back to h11, which rejects a
# repeated Host header at parse time — before _BearerAuth can return the
# rejection the MCP suite asserts.
mcp = [
    "httpx==0.28.1",
    "mcp==2.0.0",
    "starlette==1.6.0",
    "httptools==0.8.0",
]

[project.urls]
Homepage = "https://github.com/Nitjsefnie-Harness-Commons/daedalus"
Issues = "https://github.com/Nitjsefnie-Harness-Commons/daedalus/issues"

[project.scripts]
daedalus = "daedalus_cli.cli:main"

[tool.setuptools]
packages = ["daedalus_cli"]

[tool.setuptools.dynamic]
# Single source of truth, and `scripts/check_versions.py` ties that source to
# the extension's version so the wheel cannot drift from the wire format.
version = { attr = "daedalus_cli.__version__" }

[tool.coverage.run]
# parallel, because every suite is measured in its own subprocess and then
# combined — the same shape run_tests.py executes. Measuring one merged
# process would report coverage for a program nobody runs.
parallel = true
# The bridge fixture ends every child with terminate(), and coverage saves on
# interpreter exit — which SIGTERM is not. Without this the only children that
# record anything are the few that exit on their own, and server.py, the file
# those children ARE, reports a fraction of what the suites actually execute.
sigterm = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "build/*",
    "dist/*",
    "*/site-packages/*",
    # Untracked third-party JavaScript dependencies can ship Python files.
    "node_modules/*",
    # Agent tooling that ships beside the skill documenting it. These drive
    # `gh` against GitHub rather than exercising anything this repository
    # distributes, so measuring them makes the floor track the coverage of the
    # tools instead of the coverage of the product.
    ".claude/*",
]

[tool.coverage.paths]
# The runner's own tests copy run_tests.py into a temp tree and run it where
# it stands, so its lines are recorded under that path. Combining maps them
# back onto the source; without this the file every one of those tests drives
# reports 0%, and the total understates by about two points.
repo = [".", "*/tree", "*/daedalus/daedalus"]

[tool.coverage.report]
# Without this, unexecuted files below non-package directories are absent.
include_namespace_packages = true
exclude_also = ["if __name__ == .__main__.:"]
